<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Библиотека гештальт-терапевта: книги Перлза с картинками к главам и объяснением трудных слов.">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}#page p.speaking,#page h2.speaking{background:var(--accent-soft);border-radius:6px;box-shadow:0 0 0 6px var(--accent-soft)}
#ttsb.on{color:var(--accent);border-color:currentColor}
.ttsbar{position:fixed;left:50%;bottom:max(16px, env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 6px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:0 6px 24px rgba(0,0,0,.25);font:500 14px/1 system-ui,-apple-system,sans-serif;max-width:calc(100vw - 32px)}
.ttsbar button{border:0;background:none;color:inherit;cursor:pointer;height:38px;min-width:38px;border-radius:999px;font:inherit}
.ttsbar .tt-play{background:var(--paper);color:var(--ink);font-size:13px;letter-spacing:-1px}
.ttsbar .tt-lbl{padding:0 6px;white-space:nowrap;opacity:.85}
.ttsbar .tt-rate{padding:0 10px;border:1px solid color-mix(in srgb, currentColor 35%, transparent)}
.ttsbar .tt-x{opacity:.7}
.brow{display:flex;align-items:center;gap:10px}.brow .btn{height:44px;padding-top:0;padding-bottom:0}.btn.lis{width:44px;padding:0;border-radius:50%;justify-content:center;flex:none}.btn.lis svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<title>Библиотека гештальт-терапевта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,650;1,7..72,400;1,7..72,500&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one calm reading column (≈64ch) under a slim sticky bar; library is a typographic shelf of rows */
:root{
  --paper:#F1F3F0; --sheet:#F8F9F7; --ink:#1B2320; --muted:#5B6662; --line:#D3DAD6;
  --accent:#2C6A5C; --accent-soft:#DDEBE6; --term:#2C6A5C; --accent2:#C8643F;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --fs:18px; --lh:1.5;
  --shadow:0 10px 40px rgba(20,35,30,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111614; --sheet:#161C1A; --ink:#DCE3DF; --muted:#8E9A95; --line:#29332F;
  --accent:#7CC3B1; --accent-soft:#1D2E29; --term:#7CC3B1; --accent2:#E08A63; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --sheet:#161C1A; --ink:#DCE3DF; --muted:#8E9A95; --line:#29332F;
  --accent:#7CC3B1; --accent-soft:#1D2E29; --term:#7CC3B1; --accent2:#E08A63; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}
:root[data-paper="sepia"]{
  --paper:#EFE5D1; --sheet:#F5ECDB; --ink:#3A2E21; --muted:#7A6A55; --line:#DBCBAE;
  --accent:#8A5428; --accent-soft:#E8D7BA; --term:#8A5428; --accent2:#2F5D62; --shadow:0 10px 40px rgba(60,40,10,.18); color-scheme:light}
:root[data-font="sans"]{ --f-read:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif; }

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px;min-height:52px}
.bar .where{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bar .where b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .where span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid transparent;background:none;border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--accent-soft)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib .lbl{font-size:14px}
@media (max-width:560px){.ib .lbl{display:none}}
.progress{height:2px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

/* ---------- home ---------- */
.home{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:40px 80px}
.home h1{font-family:var(--f-read);font-weight:500;font-size:clamp(34px,6vw,56px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.home h1 em{color:var(--accent)}
.home .lead p{margin:0 0 .5em}
.home .tip{margin-top:28px}
@media (max-width:520px){.home .tip{flex-direction:column;gap:6px}}
.author{margin-top:72px;padding-top:40px;border-top:1px solid var(--line);display:grid;grid-template-columns:200px minmax(0,1fr);gap:36px;align-items:start}
.author .photo{width:100%;aspect-ratio:1;height:auto;max-width:100%;border-radius:8px;object-fit:cover;display:block}
.author .body{max-width:34em;min-width:0}
.author .me-fig{margin:0}
.author .me-fig figcaption{margin-top:8px;font-size:13px;line-height:1.5;color:var(--muted)}
.author .kicker{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.author h3{margin:0 0 16px;font-family:var(--f-read);font-weight:500;font-size:28px;line-height:1.15}
.author .body p:not(.kicker){margin:0 0 12px;font-size:16px;line-height:1.6;color:var(--ink)}
.author .tg{margin-top:8px;padding:9px 16px;font-size:14px}
.author .tg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
@media (max-width:640px){.author{grid-template-columns:1fr;gap:20px;margin-top:56px;padding-top:32px}.author .photo{width:160px}}
.home .lead{font-family:var(--f-ui)!important;font-size:15px!important;line-height:1.55;max-width:36em!important;margin-top:22px!important}
.mast{position:relative;display:block!important}
.mast .l{padding-right:0}
.mast .me{position:absolute;top:4px;right:0;border:0;background:none;padding:0;flex-direction:row-reverse;gap:10px;text-align:right}
.mast .me:hover{background:none}
.mast .me:hover img{box-shadow:0 0 0 3px var(--accent-soft)}
.mast .me img,.mast .me .ph{width:44px;height:44px;box-shadow:0 0 0 1px var(--line)}
.mast .me span{font-size:14px;max-width:110px}
@media (max-width:640px){.mast .l{padding-right:52px}.mast .me span{display:none}.mast .me img,.mast .me .ph{width:40px;height:40px}}
.home h1.big span{display:block;font-size:clamp(52px,11vw,112px);line-height:.95;letter-spacing:-.02em}
.home h1.big em{display:block;font-size:clamp(26px,4.4vw,44px);margin-top:10px}
.home .lead{font-family:var(--f-read);font-size:19px;color:var(--muted);max-width:40em;margin:14px 0 0}
.mods{margin-top:44px}
.mods-h{font-family:var(--f-read);font-weight:500;font-size:26px;margin:0 0 14px}
.mods-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--sheet)}
.mod-n{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mod b{font-family:var(--f-read);font-weight:500;font-size:22px}
.mod-s{font-size:13.5px;color:var(--muted)}
.mod.past{opacity:.85}
.mod-photo{align-self:flex-start;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;margin-top:2px}
.mod-photo:hover{background:var(--accent);color:var(--paper)}
.photo-box{padding:10px;width:min(640px,calc(100vw - 32px))}
.photo-box img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.photo-cap{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 0;font-weight:500}
.mod.next,.mod.now{border-color:var(--accent);background:var(--accent-soft)}
.mod.next .mod-s,.mod.now .mod-s{color:var(--accent);font-weight:600}
.wod{margin-top:30px;max-width:44em;padding:22px 24px;border-radius:18px;background:var(--accent-soft);position:relative}
.wod-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wod-k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.wod-next{display:block;margin:16px 0 0 auto;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.wod-next:hover{background:var(--accent);color:var(--paper)}
.wod-w{font-family:var(--f-read);font-weight:500;font-size:clamp(28px,4vw,38px);line-height:1.1;margin:10px 0 8px}
.wod-d{font-family:var(--f-read);font-size:18px;line-height:1.55;margin:0}
.wod-e{font-family:var(--f-read);font-size:16px;line-height:1.5;margin:10px 0 0;color:var(--muted)}
.wod-e b{font-family:var(--f-ui);font-size:13px;color:var(--accent)}
.wod-tip{font-size:13.5px;color:var(--muted);margin:16px 0 0;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.linkish{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:26px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;max-width:44em}
.tip .demo{font-family:var(--f-read);font-size:18px;border-bottom:2px dotted var(--term);cursor:help;white-space:nowrap}
.shelf{margin-top:40px;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:72px 1fr auto;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}
.row .no{font-family:var(--f-read);font-style:italic;font-size:15px;color:var(--muted);align-self:start;padding-top:8px}
.row .t{min-width:0}
.row h2{font-family:var(--f-read);font-weight:500;font-size:clamp(24px,3.4vw,34px);line-height:1.15;margin:0;text-wrap:balance}
.row .meta{color:var(--muted);margin-top:6px}
.row .pbar{margin-top:12px;height:4px;border-radius:2px;background:var(--line);max-width:320px;overflow:hidden}
.row .pbar i{display:block;height:100%;background:var(--accent);width:0}
.row .pnote{font-size:13px;color:var(--muted);margin-top:6px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:none}
@media (max-width:620px){.row{grid-template-columns:1fr;gap:10px}.row .no{padding-top:0}.row .act{justify-self:start}}

/* ---------- home v2: masthead, books with covers, readers ---------- */
.mast{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.mast .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 12px}
.mast .l{min-width:0;flex:1 1 420px}
.me{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;max-width:100%}
.me:hover{border-color:var(--accent)}
.me img,.me .ph{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent-soft)}
.me span{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.me small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:32px;margin-top:44px}
.book{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:start;min-width:0}
.cover{display:block;border:0;padding:0;background:none;cursor:pointer;border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 14px 30px -12px rgba(20,35,30,.45);transition:transform .2s;aspect-ratio:2/3;width:100%;max-width:100%}
.cover:hover{transform:translateY(-3px) rotate(-.4deg)}
.cover svg{display:block;width:100%;height:100%}
.book .info{min-width:0}
.book h2{font-family:var(--f-read);font-weight:500;font-size:clamp(22px,2.6vw,28px);line-height:1.15;margin:0;text-wrap:balance}
.book .meta{color:var(--muted);margin-top:6px;font-size:14px}
.book .pbar{margin-top:14px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.book .pbar i{display:block;height:100%;background:var(--accent);width:0}
.book .pnote{font-size:13px;color:var(--muted);margin-top:6px}
.book .btn{margin-top:16px}
.readers{display:flex;align-items:center;gap:10px;margin-top:16px;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink);font-size:14px;min-height:30px}
.readers:disabled{cursor:default}
.stack{display:flex;flex:none}
.stack img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--paper);background:var(--accent-soft);margin-left:-9px}
.stack img:first-child{margin-left:0}
.readers .who{min-width:0}
.readers .who b{font-weight:600}
.readers .none{color:var(--muted)}
@media (max-width:520px){.book{grid-template-columns:112px 1fr;gap:16px}}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:48px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:16px;padding:16px 18px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-family:var(--f-read);font-weight:500;font-size:19px}
.tile span{color:var(--muted);font-size:13.5px}

/* ---------- modal (profile) ---------- */
.modal{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 24px 22px}
.modal h3{font-family:var(--f-read);font-weight:500;font-size:28px;line-height:1.15;margin:0}
.modal p.s{color:var(--muted);margin:8px 0 20px}
.modal label.h{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.modal input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--paper);border-radius:12px;font:inherit;font-size:17px;color:var(--ink)}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 20px}
.avs button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;padding:0;background:var(--accent-soft);cursor:pointer;overflow:hidden;display:grid;place-items:center;color:var(--accent)}
.avs button img{width:100%;height:100%;object-fit:cover}
.avs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.avs .up svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.preview{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.preview img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--accent-soft)}
.preview b{font-family:var(--f-read);font-size:20px;font-weight:500;overflow-wrap:anywhere}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .note{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.45}
.rlist{display:grid;gap:12px;margin-top:16px}
.rlist .r{display:flex;align-items:center;gap:12px}
.rlist img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--accent-soft)}
.rlist .r div{flex:1;min-width:0}
.rlist .r b{display:block;font-weight:500}
.rlist .r small{color:var(--muted)}
.rlist .r .bar2{height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.rlist .r .bar2 i{display:block;height:100%;background:var(--accent)}

/* ---------- chapter plates ---------- */
.gen{display:block;width:100%;height:auto;background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.gen .g-a{fill:var(--accent)} .gen .g-b{fill:var(--accent2)} .gen .g-i{fill:var(--ink)} .gen .g-s{fill:var(--accent-soft)}
.gen .g-ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.gen .dash{stroke-dasharray:4 7;stroke:var(--muted)}
.qcard{margin:2em 0;background:var(--sheet);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.qcard .gen{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.qcard blockquote{margin:0;padding:18px 22px 4px;font-family:var(--f-read);font-size:1.12em;line-height:1.5;font-style:italic;text-wrap:pretty}
.page .eyebrow{text-indent:0}
.book-fig{margin:1.6em 0}
.book-fig img{display:block;max-width:min(320px,100%);height:auto;margin:0 auto;border-radius:6px;border:1px solid var(--line)}
.book-fig figcaption .fn{font-size:.85em;opacity:.8}
.plate.qcard figcaption{padding:0 22px 16px;font-style:normal;font-family:var(--f-ui);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.plate{margin:0 0 2em;padding:0;font-family:var(--f-ui)}
.plate svg{display:block;width:100%;height:auto;max-width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.plate figcaption{font-family:var(--f-read);font-size:.8em;line-height:1.5;color:var(--muted);margin-top:10px;font-style:italic}
.plate .ln{fill:none;stroke:var(--ink);stroke-width:2}
.plate .th{stroke-width:3}
.plate .dash{stroke-dasharray:7 7}
.plate .ac{fill:var(--accent)}
.plate .ac.o{opacity:.75}
.plate .ac-l{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.plate .sf{fill:var(--accent-soft)}
.plate .sf.o{opacity:.85}
.plate .bg{fill:var(--sheet)}
.plate .ink{fill:var(--ink)}
.plate .tx{font-family:var(--f-read);font-size:19px;fill:var(--ink)}
.pic{margin:1.6em 0}
.plate .tx.s{font-family:var(--f-ui);font-size:15.5px;fill:var(--muted)}

/* ---------- reader ---------- */
.reader{padding-inline:16px;padding-block:28px 120px}
.page{max-width:34em;margin:0 auto;font-family:var(--f-read);font-size:var(--fs);line-height:var(--lh)}
.page .eyebrow{font-family:var(--f-ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.page h2.ch{font-weight:500;font-size:1.65em;line-height:1.2;margin:0 0 1.4em;text-wrap:balance}
.page p{margin:0 0 .85em;text-indent:1.4em;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.page p.first{text-indent:0}
.page p.v{text-indent:0;margin:0 0 .2em}
.page p.v + p:not(.v){margin-top:.8em}
.page sup{font-size:.62em;line-height:0;color:var(--muted)}
.page hr{border:0;text-align:center;margin:1.6em 0}
.page hr::after{content:"⁂";color:var(--muted)}
.page .t{border-bottom:1.5px dotted var(--term);cursor:help}
.page .t:hover{background:var(--accent-soft)}
.page .hl{background:var(--accent-soft);border-radius:3px;box-shadow:0 0 0 2px var(--accent-soft)}
.page{cursor:text}
.chnav{max-width:34em;margin:3em auto 0;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-family:var(--f-ui)}
.chnav button{flex:1 1 220px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px 16px;cursor:pointer;min-width:0}
.chnav button:hover{border-color:var(--accent)}
.chnav button small{display:block;color:var(--muted);font-size:13px}
.chnav button span{display:block;font-family:var(--f-read);font-size:17px;margin-top:2px}
.chnav button.next{text-align:right}
.loading{max-width:34em;margin:4em auto;color:var(--muted);font-family:var(--f-ui)}

/* ---------- drawers / sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.35);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--sheet);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.drawer header b{flex:1;font-weight:600}
.toc{overflow:auto;padding:8px 8px 40px;flex:1}
.toc .grp{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.35}
.toc button small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.toc button:hover{background:var(--accent-soft)}
.toc button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}

.settings{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:41;background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;width:min(320px,calc(100vw - 32px));display:grid;gap:14px}
.settings label.h{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:8px 6px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sizes{display:flex;align-items:center;gap:10px}
.sizes output{flex:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---------- definition card ---------- */
.def{position:fixed;z-index:50;right:20px;bottom:20px;width:min(400px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 16px;margin-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:640px){.def{left:0;right:0;bottom:0;width:auto;border-radius:18px 18px 0 0;border-bottom:0;max-height:62vh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0}}
.def .top{display:flex;align-items:flex-start;gap:8px}
.def .word{flex:1;font-family:var(--f-read);font-size:26px;font-weight:500;line-height:1.15;overflow-wrap:anywhere}
.def .kind{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.def .txt{font-family:var(--f-read);font-size:17.5px;line-height:1.6;white-space:pre-wrap}
.def .ex{margin-top:10px;padding:10px 12px;background:var(--accent-soft);border-radius:10px;font-family:var(--f-read);font-size:16px;line-height:1.5}
.def .ex::before{content:"Пример: ";font-family:var(--f-ui);font-weight:600;font-size:13px;color:var(--accent)}
.def .ctx{margin-top:12px;font-size:13.5px;color:var(--muted);font-family:var(--f-read);font-style:italic;line-height:1.45}
.def .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.def .acts .btn{padding:8px 14px;font-size:14px}
.def .ai{margin-top:6px}
.def .ai .txt:empty{display:none}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}.progress i{transition:none}}
.err{color:var(--muted);font-size:14px}

/* ---------- glossary & video ---------- */
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:32px 100px}
.wrap h1{font-family:var(--f-read);font-weight:500;font-size:clamp(30px,5vw,44px);margin:0 0 6px}
.wrap .sub{color:var(--muted);margin:0 0 24px;font-size:16px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--sheet);border-radius:12px;font:inherit;font-size:16px;color:var(--ink)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 6px}
.letters button{border:1px solid var(--line);background:none;border-radius:8px;min-width:32px;height:32px;cursor:pointer;font-family:var(--f-read)}
.letters button:hover{border-color:var(--accent);color:var(--accent)}
.gl dt{font-family:var(--f-read);font-size:21px;font-weight:500;margin-top:22px;scroll-margin-top:80px}
.gl dd{margin:4px 0 0;font-family:var(--f-read);font-size:17px;line-height:1.6;color:var(--ink)}
.gl dd .ex{display:block;margin-top:6px;color:var(--muted);font-style:italic}
.gl .lh{font-family:var(--f-read);font-size:30px;color:var(--accent);margin-top:34px;border-bottom:1px solid var(--line);padding-bottom:4px}
.mine{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--f-read);font-size:15px}
.chip:hover{border-color:var(--accent)}
.video{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--sheet)}
.video .screen{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;background:
  radial-gradient(120% 90% at 30% 20%,var(--accent-soft),transparent 60%),var(--ink);color:var(--paper);text-decoration:none;position:relative}
.video .screen .play{width:84px;height:84px;border-radius:50%;background:var(--paper);display:grid;place-items:center;transition:transform .15s}
.video .screen:hover .play{transform:scale(1.06)}
.video .screen .play svg{width:34px;height:34px;fill:var(--ink);margin-left:5px}
.video .screen .cap{position:absolute;left:18px;bottom:14px;font-size:13px;opacity:.8;color:var(--paper)}
.video .body{padding:18px 20px 20px}
.video .body p{margin:6px 0 0;color:var(--muted)}
.video .url{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);overflow-wrap:anywhere;user-select:all;margin-top:10px}
.steps{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;font-family:var(--f-read);font-size:17px;line-height:1.55}
.steps li b{font-family:var(--f-ui);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:13px;color:var(--accent)}
.plate .hd{fill:var(--sheet);stroke:var(--ink);stroke-width:2.2}
.plate .lnk{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.plate .fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.plate .bub{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.plate .bubf{stroke:var(--sheet);stroke-width:3}
.plate .dsh{stroke-dasharray:6 6}
.plate .thk{stroke-width:3.6}
.plate .b{fill:var(--accent2)}
.plate svg.scene{background:var(--sheet)}
</style>

<div id="app"></div>

<script>
const GLOSSARY = [{"w":"Гештальт","s":["гештальт"],"d":"Немецкое слово «целое, образ, фигура». Так называют цельную картину, которую мы воспринимаем сразу, а не по кусочкам. Мелодию мы слышим как мелодию, а не как набор отдельных нот.","e":"«Незакрытый гештальт» в быту значит незаконченное дело, которое продолжает тревожить."},{"w":"Гештальттерапия","s":["гештальттерап","гештальт-терап"],"d":"Направление психотерапии, которое создал Фредерик Перлз. Главная идея: помочь человеку замечать, что он чувствует и делает прямо сейчас, и завершать «незаконченные» переживания, а не только разбирать прошлое."},{"w":"Гештальт-психология","s":["гештальт-психолог","гештальтпсихолог"],"d":"Школа психологии начала XX века. Она показала, что мы воспринимаем мир целыми образами, а не складываем их из мелких частей. Перлз взял эту идею за основу своей терапии."},{"w":"Фигура и фон","s":["фигур"],"d":"То, на чём сейчас сосредоточено внимание, — это «фигура». Всё остальное отходит на задний план и становится «фоном». Когда хочется пить, вода становится фигурой, а остальное отходит на фон."},{"w":"Организм","s":["организм"],"d":"У Перлза это человек целиком, вместе с телом, чувствами, мыслями и поведением. Он подчёркивает, что человек — не отдельно «ум» и отдельно «тело», а одно живое целое."},{"w":"Организмический","s":["организмическ"],"d":"Относящийся к человеку как к целому живому существу, к его телу, чувствам и потребностям вместе."},{"w":"Холизм","s":["холизм","холистическ","холистск"],"d":"Взгляд, при котором целое важнее и больше суммы частей. Человека нужно понимать целиком, а не разбирать на отдельные «детали»."},{"w":"Психоанализ","s":["психоанализ","психоаналитическ"],"d":"Метод лечения и теория Зигмунда Фрейда. Считается, что многие проблемы идут из скрытых, неосознаваемых желаний и детских переживаний, и их выводят наружу через разговор с аналитиком. Перлз начинал как психоаналитик, а потом спорил с Фрейдом."},{"w":"Психоаналитик","s":["психоаналитик"],"d":"Специалист, который лечит методом психоанализа, то есть через долгие разговоры, свободные ассоциации и разбор снов и детства."},{"w":"Фрейд","s":["фрейд"],"d":"Зигмунд Фрейд (1856–1939), австрийский врач, создатель психоанализа. Перлз много спорит с его идеями в этой книге."},{"w":"Фрейдовский","s":["фрейдовск","фрейдистск"],"d":"Связанный с учением Фрейда."},{"w":"Психотерапия","s":["психотерап"],"d":"Помощь людям с душевными трудностями с помощью разговора, упражнений и отношений с терапевтом, без лекарств."},{"w":"Терапевт","s":["терапевт"],"d":"Здесь это психотерапевт, человек, который помогает клиенту разобраться в себе. Это не врач-терапевт из поликлиники."},{"w":"Пациент","s":["пациент"],"d":"Человек, который пришёл за помощью к врачу или психотерапевту. Сейчас в психотерапии чаще говорят «клиент»."},{"w":"Психиатр","s":["психиатр"],"d":"Врач, который лечит психические расстройства и может выписывать лекарства."},{"w":"Эго","s":["=эго","эго,","эго-"],"d":"Буквально «я» по-латыни. У Перлза эго — это способность человека отличать «моё» от «не моего»: принимать одно и отвергать другое. Это не «зазнайство», как в бытовой речи.","e":"Когда вы говорите «это я хочу, а это мне не подходит», работает эго."},{"w":"Эгоцентризм","s":["эгоцентр"],"d":"Когда человек смотрит на всё только со своей точки зрения и плохо замечает других."},{"w":"Ид","s":["=ид"],"d":"В теории Фрейда это «Оно»: самая глубокая часть психики, откуда идут влечения и желания."},{"w":"Суперэго","s":["суперэго","сверх-я","сверх–я"],"d":"В теории Фрейда это «Сверх-Я», внутренний голос правил, запретов и совести, который мы перенимаем от родителей и общества."},{"w":"Агрессия","s":["агресси"],"d":"У Перлза это не только злость и драка. Это здоровая сила, которая нужна, чтобы «откусить» и «разжевать» то, что нам нужно: пищу, идеи, впечатления. Без неё мы глотаем всё целиком, не разбираясь.","e":"Решиться высказать своё мнение тоже проявление здоровой агрессии."},{"w":"Агрессивный","s":["агрессивн"],"d":"Проявляющий агрессию: напористый, наступательный. У Перлза это слово не всегда плохое."},{"w":"Инстинкт","s":["инстинкт"],"d":"Врождённое стремление, которому не учатся. Например, голод заставляет искать пищу. Перлз ставит пищевой инстинкт (голод) рядом с половым."},{"w":"Пищевой инстинкт","s":["пищев"],"d":"Врождённая потребность искать, кусать, жевать и усваивать пищу. Перлз сравнивает с этим то, как мы «усваиваем» идеи и впечатления."},{"w":"Метаболизм","s":["метаболизм","метаболическ"],"d":"Обмен веществ: как тело принимает пищу, разбирает её и делает частью себя. «Ментальный метаболизм» у Перлза — то же самое с мыслями и опытом."},{"w":"Ментальный","s":["ментальн"],"d":"Умственный, психический, относящийся к мыслям и уму."},{"w":"Ассимиляция","s":["ассимил"],"d":"Усвоение. Когда что-то чужое переваривается и становится своим. Пища переваривается и становится частью тела, а понятая идея становится частью твоих взглядов."},{"w":"Интроекция","s":["интроек","интроец","интро-ект","интро–ект"],"d":"Когда человек «проглатывает» чужие правила, мнения и требования целиком, не обдумав их. Они живут внутри как чужеродное тело.","e":"«Мальчики не плачут» — услышал в детстве и до сих пор так живёшь, не спрашивая себя, согласен ли."},{"w":"Интроект","s":["интроект"],"d":"Конкретное «проглоченное» чужое убеждение или правило, которое человек считает своим, хотя никогда его не проверял."},{"w":"Проекция","s":["проекци","проециров","проецир","проектир"],"d":"Когда человек приписывает другим то, что на самом деле есть в нём самом, но он этого в себе не признаёт.","e":"Сам злишься, но тебе кажется, что это все вокруг на тебя злятся."},{"w":"Ретрофлексия","s":["ретрофле"],"d":"Буквально «обращение назад». Человек делает себе то, что хотел бы сделать другому (или чтобы другие сделали ему).","e":"Злишься на начальника, но вместо этого ругаешь себя или сжимаешь челюсти до боли."},{"w":"Конфлюэнция (слияние)","s":["конфлюэн","слияни"],"d":"Состояние, когда нет границы между «я» и «другой»: человек не различает свои и чужие чувства и желания.","e":"«Мы любим этот фильм», хотя на самом деле его любит только партнёр."},{"w":"Дефлексия","s":["дефлекс"],"d":"Уход от прямого контакта: шутки, смена темы, общие слова вместо того, чтобы встретиться с тем, что происходит."},{"w":"Контакт","s":["контакт"],"d":"В гештальттерапии это живая встреча человека с миром: с людьми, с вещами, со своими чувствами. Здоровый контакт значит ясно замечать, что происходит, и откликаться на это."},{"w":"Граница контакта","s":["границ"],"d":"Воображаемая линия, где кончаюсь «я» и начинается «не я». На ней происходит всё общение с миром: что-то я принимаю, что-то отвергаю."},{"w":"Осознавание","s":["сознаван","осознаван","созна-ван","созна–ван","сознава"],"d":"Ключевое слово гештальттерапии (по-английски awareness). Это ясное замечание того, что происходит со мной прямо сейчас: что я вижу, чувствую в теле, хочу, думаю. Это не «анализ», а просто внимательное присутствие.","e":"«Сейчас я замечаю, что у меня напряжены плечи и мне скучно»."},{"w":"Осознанность","s":["осознанност"],"d":"Состояние, в котором человек замечает, что с ним происходит, и живёт не «на автомате»."},{"w":"Здесь и сейчас","s":["здесь-и-сейчас"],"d":"Главный принцип гештальта: внимание к тому, что происходит в настоящий момент, а не к прошлому или будущему."},{"w":"Актуальность","s":["актуальн"],"d":"Здесь значит то, что есть на самом деле прямо сейчас, в настоящий момент. «Чувствовать актуальное» значит замечать, что происходит сейчас."},{"w":"Сосредоточение (концентрация)","s":["сосредоточ","концентрац","концентрир"],"d":"Направленное внимание на что-то одно. «Терапия сосредоточением» у Перлза значит учиться полностью сосредотачиваться на том, что ешь, чувствуешь, делаешь."},{"w":"Невроз","s":["невроз"],"d":"Расстройство, при котором человек страдает от тревоги, навязчивостей, страхов, но в целом остаётся в контакте с реальностью. У Перлза невроз связан с тем, что человек мешает сам себе удовлетворять потребности."},{"w":"Невротик","s":["невротик","невротическ"],"d":"Человек с неврозом, или поведение, похожее на невроз: тревожное, застревающее, саморазрушительное."},{"w":"Неврастения","s":["неврастен"],"d":"Старое название нервного истощения: усталость, раздражительность, плохой сон, головные боли."},{"w":"Психоз","s":["психоз","психотическ"],"d":"Тяжёлое психическое состояние, при котором человек теряет связь с реальностью: видит или слышит то, чего нет, верит в странные идеи."},{"w":"Паранойя","s":["паранойя","паранойе","паранойи","параной"],"d":"Состояние, при котором человек подозрителен, считает, что ему хотят навредить и все против него."},{"w":"Шизофрения","s":["шизофрен"],"d":"Тяжёлое психическое заболевание, при котором нарушается мышление и восприятие реальности."},{"w":"Истерия","s":["истери"],"d":"Устаревшее медицинское название состояния, когда сильные чувства проявляются бурно или через телесные симптомы."},{"w":"Меланхолия","s":["меланхол"],"d":"Старое название глубокой грусти и подавленности, похоже на депрессию."},{"w":"Депрессия","s":["депресс"],"d":"Состояние длительной подавленности, когда пропадают силы, интерес и радость."},{"w":"Мания","s":["маниакал"],"d":"Состояние чрезмерного возбуждения, подъёма и переоценки своих сил."},{"w":"Мегаломания","s":["мегаломан"],"d":"Мания величия: преувеличенное представление о своей важности и силе."},{"w":"Изгой","s":["изгой"],"d":"Отверженный, тот, кого не принимают. Перлз пишет, что за манией величия часто прячется чувство «я никому не нужен»."},{"w":"Симптом","s":["симптом"],"d":"Признак болезни или проблемы: например, бессонница, головная боль, тревога."},{"w":"Патология","s":["патолог"],"d":"Болезненное отклонение от нормы."},{"w":"Тревожность","s":["тревожн","тревог"],"d":"Чувство беспокойства и напряжения без ясной причины. Перлз говорит, что тревога часто означает возбуждение, которому не дали выйти наружу, например когда задерживают дыхание.","e":"Перед выступлением сердце колотится, а дышишь мелко — это и есть такая тревога."},{"w":"Возбуждение","s":["возбужд"],"d":"Здесь не обязательно в половом смысле. Это прилив жизненной энергии, интерес, оживление в теле."},{"w":"Фрустрация","s":["фрустрац","фрустрир"],"d":"Неприятное чувство, когда потребность или желание не получается удовлетворить: досада, разочарование, раздражение."},{"w":"Потребность","s":["потребност"],"d":"То, что человеку нужно: еда, отдых, близость, признание. В гештальте здоровая жизнь значит замечать свои потребности и удовлетворять их."},{"w":"Удовлетворение","s":["удовлетвор"],"d":"Когда потребность выполнена и наступает облегчение, «гештальт закрывается»."},{"w":"Саморегуляция","s":["саморегул"],"d":"Способность организма самому поддерживать равновесие: проголодался, поел, насытился. Перлз верит, что человек, если ему не мешать, сам «знает», что ему нужно."},{"w":"Равновесие (гомеостаз)","s":["равновес","гомеостаз"],"d":"Состояние баланса. Организм всё время стремится его восстановить: замёрз, ищет тепло; устал, ищет отдых."},{"w":"Дифференциальное мышление","s":["дифференциальн"],"d":"Способ мышления, который предлагает Перлз: видеть противоположности (холодное–горячее, хорошее–плохое) как два конца одной линии с «нулевой точкой» посередине."},{"w":"Дифференциация","s":["дифференц"],"d":"Различение, разделение на части. Умение видеть разницу между вещами."},{"w":"Нулевая точка (индифференция)","s":["индиффер","нулев"],"d":"Середина между двумя противоположностями, точка равновесия. Например, между «холодно» и «горячо» есть «нормальная температура»."},{"w":"Полярность","s":["полярн","поляр"],"d":"Пара противоположностей: сила и слабость, любовь и ненависть. Перлз считает, что они связаны друг с другом, как два полюса магнита."},{"w":"Противоположность","s":["противоположн"],"d":"То, что прямо противостоит другому: день и ночь, радость и печаль."},{"w":"Дуализм","s":["дуализм","дуалистич"],"d":"Взгляд, при котором мир делят на две отдельные сущности, например «душа» и «тело». Перлз против такого разделения."},{"w":"Диалектика","s":["диалектик","диалектич"],"d":"Способ мышления через противоположности, которые сталкиваются и рождают что-то новое."},{"w":"Детерминизм","s":["детерминизм","детерминист"],"d":"Идея, что всё заранее определено причинами. Например: «ты такой из-за детства, и ничего не поделаешь»."},{"w":"Релятивизм","s":["релятивизм","релятивист"],"d":"Взгляд, что всё относительно и зависит от точки зрения и обстоятельств."},{"w":"Экзистенциальный","s":["экзистенц"],"d":"Касающийся самого существования человека: жизни, смерти, свободы, выбора, смысла."},{"w":"Феномен","s":["феномен"],"d":"Явление, то, что можно наблюдать и переживать."},{"w":"Феноменология","s":["феноменолог"],"d":"Подход в философии и психологии: описывать то, как человек переживает что-то, без готовых объяснений и оценок."},{"w":"Абстракция","s":["абстрак"],"d":"Отвлечённое понятие, которое нельзя потрогать: «справедливость», «душа». Абстрагироваться значит отвлечься от деталей."},{"w":"Интеллектуализация","s":["интеллектуализ"],"d":"Когда человек уходит в рассуждения и умные слова, чтобы не чувствовать. Говорит о злости, но не злится."},{"w":"Рационализация","s":["рационализ"],"d":"Придумывание разумного объяснения для поступка, настоящая причина которого другая и неприятная.","e":"«Я не пошёл на собеседование, потому что погода плохая» (а на самом деле испугался)."},{"w":"Рациональный","s":["рациональн"],"d":"Разумный, основанный на логике и расчёте."},{"w":"Иррациональный","s":["иррациональн"],"d":"Не поддающийся логике, нелогичный."},{"w":"Сопротивление","s":["сопротивлен"],"d":"В терапии так называют способы, которыми человек (часто не замечая этого) избегает неприятных чувств и перемен. Перлз считает, что сопротивление нужно не ломать, а исследовать."},{"w":"Защита","s":["защит"],"d":"В психологии это способ, которым психика бережёт себя от боли и тревоги: не замечать, забыть, обвинить других."},{"w":"Вытеснение","s":["вытесн"],"d":"Когда неприятное воспоминание или желание «выталкивается» из сознания и человек о нём будто забывает."},{"w":"Подавление","s":["подавлен","подавля","подави"],"d":"Сознательное или полусознательное сдерживание чувств и желаний, когда их «загоняют внутрь»."},{"w":"Бессознательное","s":["бессознательн","неосознанн","неосознаваем"],"d":"Всё, что происходит в психике, но человек этого не замечает: скрытые желания, страхи, привычки."},{"w":"Сознание","s":["сознани"],"d":"Способность ясно понимать себя и мир вокруг, то, что мы сейчас осознаём."},{"w":"Либидо","s":["либидо"],"d":"У Фрейда это энергия влечений, прежде всего полового. Перлз считает, что Фрейд слишком всё сводил к нему."},{"w":"Влечение","s":["влечени"],"d":"Внутреннее стремление к чему-то: к еде, близости, действию."},{"w":"Сублимация","s":["сублимац"],"d":"Когда энергия запретного желания перенаправляется на что-то полезное: творчество, спорт, работу."},{"w":"Регрессия","s":["регресс"],"d":"Возврат к более детскому поведению, когда трудно. Например, взрослый начинает капризничать, как ребёнок."},{"w":"Фиксация","s":["фиксац"],"d":"«Застревание» на чём-то, когда человек снова и снова возвращается к одному и тому же."},{"w":"Перенос","s":["перенос"],"d":"Когда клиент переносит на терапевта чувства, которые были к важным людям из прошлого, например к родителям."},{"w":"Катарсис","s":["катарсис"],"d":"Очищение и облегчение после того, как сильные чувства наконец выражены."},{"w":"Комплекс","s":["комплекс"],"d":"Здесь значит устойчивый узел переживаний и привычек, который влияет на поведение. Например, «комплекс пустышки»."},{"w":"Комплекс пустышки","s":["пустышк"],"d":"Образ Перлза: как младенец сосёт пустышку и ничего не получает, так взрослый может «жевать» пустые занятия вместо настоящего удовлетворения."},{"w":"Оральный","s":["оральн"],"d":"Связанный со ртом: сосание, кусание, жевание. У Фрейда это первая стадия развития младенца."},{"w":"Анальный","s":["анальн"],"d":"У Фрейда это связанное с опорожнением кишечника и периодом приучения к горшку. Отсюда выражения про чрезмерную аккуратность и контроль."},{"w":"Генитальный","s":["генитальн"],"d":"Связанный с половыми органами; у Фрейда так называется зрелая стадия развития."},{"w":"Дентальный","s":["дентальн"],"d":"Связанный с зубами. Перлз говорит о «дентальной агрессии»: способности кусать и жевать, буквально и в переносном смысле (разбирать идеи на части)."},{"w":"Дефекация","s":["дефекац"],"d":"Медицинское слово, значит опорожнение кишечника."},{"w":"Фригидность","s":["фригидн"],"d":"Устаревшее слово: отсутствие сексуального удовольствия и желания (обычно о женщинах)."},{"w":"Мастурбация","s":["мастурб"],"d":"Самоудовлетворение, сексуальная стимуляция самого себя."},{"w":"Импотенция","s":["импотен"],"d":"Половое бессилие у мужчин."},{"w":"Сексуальный","s":["сексуальн"],"d":"Связанный с половой жизнью и половым влечением."},{"w":"Идентификация","s":["идентифи"],"d":"Отождествление себя с кем-то или чем-то: «я такой же, как он», «это я». Перлз учит отождествляться со своими чувствами и действиями, говорить «я злюсь», а не «злость появилась»."},{"w":"Отождествление","s":["отождеств"],"d":"То же, что идентификация: принять что-то как часть себя."},{"w":"Отчуждение","s":["отчужд"],"d":"Когда человек отказывается от части себя, считает её чужой («это не я»)."},{"w":"Целостность","s":["целостн"],"d":"Состояние, когда человек ощущает себя единым, без разорванных на части чувств и желаний."},{"w":"Интеграция","s":["интеграц","интегрир"],"d":"Объединение разрозненных частей в одно целое. В терапии это значит принять отвергнутые части себя."},{"w":"Раскол личности","s":["раскол"],"d":"Когда человек как будто разделён на части, которые спорят между собой, например «хочу» и «надо»."},{"w":"Личность","s":["личност"],"d":"Человек со всеми его особенностями: характером, привычками, взглядами."},{"w":"Индивид","s":["индивид"],"d":"Отдельный человек как единица."},{"w":"Характер","s":["характер"],"d":"Набор устойчивых черт человека: как он обычно думает, чувствует и поступает."},{"w":"Темперамент","s":["темперамент"],"d":"Врождённые особенности: насколько человек быстрый или медленный, спокойный или вспыльчивый."},{"w":"Ориентирование","s":["ориентир","ориентац"],"d":"Умение понять, где ты, что происходит и что тебе нужно."},{"w":"Манипулирование","s":["манипул"],"d":"У Перлза в «Практикуме» это просто активное действие: как человек управляет собой и обстоятельствами. В бытовом смысле так говорят о скрытом управлении другими людьми."},{"w":"Экстероцепция","s":["экстероцеп"],"d":"Восприятие того, что снаружи: зрение, слух, обоняние."},{"w":"Проприоцепция","s":["проприоцеп"],"d":"Ощущение собственного тела изнутри: положение, напряжение мышц, движения."},{"w":"Интроспекция","s":["интроспек"],"d":"Самонаблюдение, когда человек «смотрит внутрь себя» и наблюдает свои мысли и чувства."},{"w":"Сенсорный","s":["сенсорн"],"d":"Связанный с ощущениями: зрением, слухом, осязанием, вкусом, запахом."},{"w":"Сенсомоторный","s":["сенсомотор"],"d":"Связанный и с ощущениями, и с движениями тела."},{"w":"Моторный","s":["моторн"],"d":"Двигательный, связанный с движениями мышц."},{"w":"Мышечный панцирь","s":["панцир"],"d":"Идея Вильгельма Райха: хроническое напряжение мышц, которым человек сдерживает чувства, как бронёй."},{"w":"Визуализация","s":["визуализ"],"d":"Мысленное представление картинок: представить себе образ во всех подробностях."},{"w":"Галлюцинация","s":["галлюцин"],"d":"Когда человек видит, слышит или чувствует то, чего на самом деле нет."},{"w":"Фантазия","s":["фантаз"],"d":"Воображение, мысленные картины. У Перлза часто значит жизнь «в голове» вместо реальности."},{"w":"Внутренний монолог","s":["внутреннее молчан","внутреннего молчан"],"d":"Мысленная болтовня, которую мы ведём сами с собой. Перлз предлагает упражнение «внутреннее молчание», чтобы её утихомирить."},{"w":"Вербализация","s":["вербализ","вербальн"],"d":"Выражение словами. Вербальный значит словесный."},{"w":"Субвокальная речь","s":["субвокальн"],"d":"Беззвучное проговаривание слов про себя, когда думаешь «словами»."},{"w":"Ассоциация","s":["ассоциа"],"d":"Связь, когда одно вызывает в памяти другое. В психоанализе «свободные ассоциации» значит говорить всё, что приходит в голову."},{"w":"Интерпретация","s":["интерпрет"],"d":"Толкование, объяснение смысла. В психоанализе аналитик объясняет клиенту, что «на самом деле» значат его слова или сны."},{"w":"Катастрофический","s":["катастрофическ"],"d":"Перлз так называет фантазии, где представляешь самое плохое, что может случиться."},{"w":"Анастрофический","s":["анастрофическ"],"d":"Слово Перлза: фантазии, где представляешь, что всё выйдет прекрасно, противоположность катастрофическим."},{"w":"Имплозия","s":["имплози"],"d":"Слово Перлза для «взрыва внутрь»: состояние, когда энергия сжата и человек как будто застыл и ничего не может сделать."},{"w":"Эксплозия","s":["эксплози"],"d":"Слово Перлза для «взрыва наружу»: когда сдержанное чувство наконец прорывается (горе, гнев, радость, оргазм) и человек оживает."},{"w":"Тупик (импасс)","s":["тупик","импасс"],"d":"Точка в терапии, где человек застрял: старый способ уже не работает, а новый ещё не найден. Перлз считает, что именно здесь возможен рост."},{"w":"Горячий стул","s":["горячий стул","горячего стул"],"d":"Приём Перлза в группе: человек садится на особый стул и работает с терапевтом при всех, а остальные наблюдают."},{"w":"Пустой стул","s":["пустой стул","пустого стул","пустом стул"],"d":"Знаменитая техника гештальта: представить на пустом стуле человека (или часть себя) и поговорить с ним вслух."},{"w":"Собака сверху / собака снизу","s":["собака сверху","собака снизу","topdog","underdog","удачник","неудачник"],"d":"Образы Перлза для двух спорящих частей внутри человека. «Собака сверху» (в этом переводе «удачник») строго требует и командует: «ты должен!». «Собака снизу» («неудачник») хитро сопротивляется: «да, но…», «завтра»."},{"w":"Незавершённое дело","s":["незавершен","незакончен","незаконче"],"d":"Чувство или ситуация, которые не были до конца прожиты: не сказал, не попрощался, не выразил злость. Такие дела «тянут» внимание и энергию, пока их не закроешь."},{"w":"Завершение гештальта","s":["завершен"],"d":"Когда потребность удовлетворена или ситуация прожита до конца, и внимание освобождается для нового."},{"w":"Избегание","s":["избеган","избега"],"d":"Уход от неприятного: не думать, не замечать, сменить тему. Перлз считает избегание одной из главных проблем невроза."},{"w":"Ответственность","s":["ответствен"],"d":"У Перлза это не «вина», а «способность отвечать»: признавать «это я делаю, это я чувствую» и не перекладывать на других."},{"w":"Самоподдержка","s":["самоподдерж"],"d":"Способность опираться на себя, а не ждать, что другие всё сделают за тебя. Цель терапии у Перлза — переход от поддержки окружения к самоподдержке."},{"w":"Созревание","s":["созреван","зрелост"],"d":"Взросление в психологическом смысле: переход от зависимости от других к опоре на себя."},{"w":"Спонтанность","s":["спонтанн"],"d":"Естественность, когда действуешь по живому порыву, а не по заранее заготовленному плану."},{"w":"Аутентичность","s":["аутентичн","подлинн"],"d":"Подлинность: быть собой, а не играть роль."},{"w":"Ригидность","s":["ригидн"],"d":"Негибкость, «окаменелость»: человек действует по одной схеме и не может её поменять."},{"w":"Компульсивный (навязчивый)","s":["компульс","навязчив","обсессив"],"d":"Такой, который не отпускает: мысль или действие повторяется снова и снова против желания человека."},{"w":"Амбивалентность","s":["амбивалент"],"d":"Двойственность чувств, когда одновременно испытываешь противоположное, например любовь и злость к одному человеку."},{"w":"Враждебность","s":["враждебн"],"d":"Недружелюбное, злое отношение к кому-то."},{"w":"Отвращение","s":["отвращ"],"d":"Сильное чувство неприятия, «тошноты» от чего-то. У Перлза отвращение — здоровый сигнал, что что-то не стоит «глотать»."},{"w":"Застенчивость","s":["застенчив"],"d":"Робость в общении и неловкость при других. Перлз связывает её с тем, что человек сам себя всё время разглядывает со стороны."},{"w":"Смущение","s":["смущен"],"d":"Неловкость и стыд, когда кажется, что на тебя смотрят и оценивают."},{"w":"Вина","s":["чувство вин","чувства вин"],"d":"Чувство, что поступил плохо. Перлз считает, что за чувством вины часто прячется невысказанная обида или злость."},{"w":"Обида","s":["обид"],"d":"Задетые чувства. По Перлзу обида часто значит невыраженную злость вместе с требованием к другому."},{"w":"Совесть","s":["совест"],"d":"Внутреннее чувство «правильно» и «неправильно». У Перлза совесть часто состоит из «проглоченных» правил родителей."},{"w":"Мораль","s":["морал"],"d":"Правила о том, что хорошо и что плохо, принятые в обществе."},{"w":"Цивилизация","s":["цивилизац"],"d":"Культура и уклад общества. Перлз пишет, что цивилизация учит людей подавлять естественные порывы."},{"w":"Биологический","s":["биологич"],"d":"Связанный с живым телом и законами жизни."},{"w":"Физиологический","s":["физиологич"],"d":"Связанный с работой органов тела."},{"w":"Психосоматический","s":["психосомат"],"d":"Когда душевные переживания отражаются на теле, например стресс вызывает боль в желудке."},{"w":"Соматический","s":["соматич"],"d":"Телесный."},{"w":"Энцефалит","s":["энцефалит"],"d":"Воспаление головного мозга, тяжёлая болезнь."},{"w":"Амнезия","s":["амнези"],"d":"Потеря памяти."},{"w":"Корсаковский синдром","s":["корсак"],"d":"Тяжёлое нарушение памяти, чаще всего из-за алкоголизма. Человек «заполняет» провалы выдуманными воспоминаниями."},{"w":"Псилоцибин","s":["псилоцибин"],"d":"Вещество из некоторых грибов, вызывающее изменённые состояния сознания. Перлз пишет о своём опыте с ним."},{"w":"Медитация","s":["медитац","медитир"],"d":"Практика успокоения ума и сосредоточения внимания, например на дыхании."},{"w":"Дзен","s":["дзен"],"d":"Направление буддизма, где главное — прямое переживание момента, а не рассуждения. Перлз жил в японском дзен-монастыре."},{"w":"Сатори","s":["сатори"],"d":"В дзен-буддизме внезапное «просветление», ясное понимание."},{"w":"Ортодоксальный","s":["ортодокс"],"d":"Строго следующий старому, принятому учению, без отступлений."},{"w":"Эклектика","s":["эклектик","эклектич"],"d":"Смешение разных подходов и идей в одном."},{"w":"Эмпирический","s":["эмпирич"],"d":"Основанный на опыте и наблюдении, а не на теории."},{"w":"Гипотеза","s":["гипотез"],"d":"Научное предположение, которое ещё нужно проверить."},{"w":"Концепция","s":["концепц"],"d":"Общая идея, взгляд на что-то, система представлений."},{"w":"Парадокс","s":["парадокс"],"d":"Утверждение, которое кажется противоречивым или странным, но может оказаться верным."},{"w":"Тенденция","s":["тенденц"],"d":"Направление, склонность к чему-то."},{"w":"Импульс","s":["импульс"],"d":"Внезапное внутреннее побуждение что-то сделать."},{"w":"Эмоция","s":["эмоци"],"d":"Чувство: радость, страх, гнев, грусть. Перлз называет эмоции «двигателем», который заставляет нас действовать."},{"w":"Аффект","s":["аффект"],"d":"Очень сильная, бурная эмоция, которая на время захватывает человека."},{"w":"Энергия","s":["энерги"],"d":"Здесь значит жизненная сила, бодрость, возбуждение, которое можно направить на действие."},{"w":"Мобилизация","s":["мобилиз"],"d":"Собирание сил для действия."},{"w":"Катексис","s":["катексис"],"d":"Термин Фрейда: «вложение» психической энергии в какой-то объект или идею."},{"w":"Объект","s":["объект"],"d":"В психологии так часто называют любой предмет внимания или чувства, в том числе человека. «Объект любви» — человек, которого любят."},{"w":"Субъект","s":["субъект"],"d":"Тот, кто действует, чувствует и воспринимает (в отличие от объекта, на который направлено действие)."},{"w":"Объективный","s":["объективн"],"d":"Беспристрастный, не зависящий от личного мнения."},{"w":"Субъективный","s":["субъективн"],"d":"Личный, зависящий от того, как видит конкретный человек."},{"w":"Холист","s":["холист"],"d":"Сторонник холизма, то есть взгляда на человека как на целое."},{"w":"Альтруист","s":["альтруи"],"d":"Человек, который бескорыстно заботится о других."},{"w":"Тщеславие","s":["тщеслав"],"d":"Желание славы, похвалы и восхищения окружающих."},{"w":"Примадонна","s":["примадонн"],"d":"Главная певица в опере. В переносном смысле это человек, который любит быть в центре внимания."},{"w":"Богема","s":["богем"],"d":"Круг художников, поэтов и артистов, живущих свободно и не по общепринятым правилам."},{"w":"Киббуц","s":["киббуц","кибуц"],"d":"Израильская сельская община, где люди живут и работают вместе. Перлз хотел создать «гештальт-киббуц»."},{"w":"Эсален","s":["изален","исален","эсален"],"d":"Институт Эсален в Калифорнии (Биг-Сур), известный центр психологии и личностного роста 1960-х, где жил и вёл группы Перлз."},{"w":"Энфант террибль","s":["enfant"],"d":"Французское «ужасный ребёнок»: озорник, который всем доставляет хлопоты, или человек, говорящий неудобную правду."},{"w":"Семинар","s":["семинар"],"d":"Здесь значит групповое занятие, на котором терапевт работает с участниками."},{"w":"Эксперимент","s":["эксперимент"],"d":"В гештальте это не научный опыт в лаборатории, а упражнение-проба: «попробуй сделать так и заметь, что с тобой происходит»."},{"w":"Техника","s":["техник"],"d":"Здесь значит конкретный приём или упражнение."},{"w":"Ресентимент","s":["ресентимент"],"d":"Затаённая обида и злость на кого-то, которую человек не высказывает."},{"w":"Нарциссизм","s":["нарцисс"],"d":"Сильная сосредоточенность на себе, своей важности и образе."},{"w":"Мазохизм","s":["мазохи"],"d":"Получение удовольствия или облегчения от собственного страдания."},{"w":"Садизм","s":["садизм","садист"],"d":"Получение удовольствия от причинения страдания другим."},{"w":"Инфантильный","s":["инфантил"],"d":"Детский, незрелый, о взрослом, который ведёт себя как ребёнок."},{"w":"Аутизм","s":["аутизм","аутист"],"d":"Здесь в старом смысле: уход в свой внутренний мир, отгороженность от людей."},{"w":"Конформизм","s":["конформ"],"d":"Склонность подстраиваться под мнение большинства."},{"w":"Изоляция","s":["изоляц","изолир"],"d":"Отделение, обособленность, когда человек отгорожен от других или от каких-то своих чувств."},{"w":"Резиньяция","s":["резиньяц"],"d":"Покорное смирение, отказ бороться."},{"w":"Апатия","s":["апати"],"d":"Безразличие, когда ничего не хочется и ничего не трогает."},{"w":"Инертность","s":["инертн"],"d":"Вялость, неподвижность, нежелание что-то менять."},{"w":"Эвристический","s":["эвристич"],"d":"Помогающий найти новое решение или открытие."},{"w":"Трансфер","s":["трансфер"],"d":"То же, что перенос: когда чувства к важным людям из прошлого переносятся на терапевта."},{"w":"Реактивный","s":["реактивн"],"d":"Возникший как ответная реакция на что-то."},{"w":"Квинтэссенция","s":["квинтэссенц"],"d":"Самое главное, суть."},{"w":"Квази-","s":["квази"],"d":"Приставка «как будто», «почти»: квазиразумный значит «как будто разумный»."},{"w":"Псевдо-","s":["псевдо"],"d":"Приставка «ложный», «ненастоящий»: псевдометаболизм значит ненастоящее усвоение."},{"w":"Само-","s":["самоконтрол"],"d":"Самоконтроль значит управление собой, сдерживание своих чувств и поступков."},{"w":"Ситуация","s":["ситуац"],"d":"Положение дел, обстоятельства, в которых человек оказался сейчас."},{"w":"Функция","s":["функци","функцио","фунцкио"],"d":"Работа, роль, назначение чего-либо. «Функция глаза» — видеть. «Функционировать» значит работать, действовать."},{"w":"Реакция","s":["реакци","реагир","реагиру","отреаги"],"d":"Ответ на что-то: действие, чувство или изменение, которое возникает в ответ на событие."},{"w":"Отреагирование","s":["отреагир"],"d":"Психологический термин: выплеснуть накопленное чувство (поплакать, накричать), чтобы стало легче."},{"w":"Механизм","s":["механиз"],"d":"Здесь значит способ, которым что-то устроено и работает. «Механизм защиты» — то, как психика себя оберегает."},{"w":"Механистический","s":["механист","механиц","механич"],"d":"Объясняющий живое как машину, будто человек — набор деталей. Перлз с таким взглядом спорит."},{"w":"Интеллект","s":["интелле","интелли"],"d":"Ум, способность думать, понимать и решать задачи. «Интеллектуальный» значит умственный."},{"w":"Специфический","s":["специфи"],"d":"Особый, характерный только для чего-то одного."},{"w":"Примитивный","s":["примити"],"d":"Простой, первобытный, самый ранний по развитию. Не обязательно «глупый»."},{"w":"Деструктивный","s":["деструк"],"d":"Разрушительный. Деструкция — разрушение. У Перлза разрушение (например, разжёвывание пищи) бывает полезным."},{"w":"Негативный","s":["негатив"],"d":"Отрицательный, плохой или направленный «против»."},{"w":"Позитивный","s":["позитив"],"d":"Положительный, хороший или направленный «за»."},{"w":"Интенсивный","s":["интенси"],"d":"Сильный, напряжённый, насыщенный."},{"w":"Пассивный","s":["пассивн"],"d":"Бездействующий, когда человек не проявляет инициативы и ждёт, что всё сделают за него."},{"w":"Активный","s":["активн","активны","активна","активну","активиз","активир"],"d":"Деятельный, проявляющий инициативу. Активизировать значит сделать более деятельным."},{"w":"Хронический","s":["хрониче"],"d":"Длительный, затяжной, который тянется долго (о болезни, привычке, напряжении)."},{"w":"Классификация","s":["классиф"],"d":"Распределение чего-либо по группам и видам."},{"w":"Субстанция","s":["субстан"],"d":"Вещество, основа, «то, из чего что-то сделано». Перлз спорит с идеей, что эго — это какая-то субстанция."},{"w":"Кастрация","s":["кастрац","кастрир"],"d":"Удаление половых желёз. В психоанализе «страх кастрации» — детский страх потерять половой орган как наказание."},{"w":"Инструкция","s":["инструк"],"d":"Указание, как что-то делать."},{"w":"Контроль","s":["контрол"],"d":"Проверка и управление. «Контролировать себя» — сдерживать и направлять свои чувства и действия."},{"w":"Централизация","s":["централ","центрир","децентр"],"d":"Собирание вокруг центра. Центрировать — ставить в центр. Децентрация — смещение из центра."},{"w":"Позиция","s":["позици"],"d":"Положение, точка зрения или место, которое занимает человек."},{"w":"Операция","s":["операци","операти","опериро"],"d":"Действие или процедура. Оперировать значит действовать с чем-то (в медицине — делать хирургическую операцию)."},{"w":"Проецировать","s":["спроеци"],"d":"Перенести своё на другого. См. «Проекция»."},{"w":"Критический","s":["критиче","критици","некрити"],"d":"Здесь: оценивающий, придирчивый, а иногда «решающий, переломный» (критический момент)."},{"w":"Потенциал","s":["потенци"],"d":"Скрытые возможности, то, на что человек способен, даже если пока этого не делает."},{"w":"Блокировать","s":["блокиро","блокиру","заблоки","разблок"],"d":"Перекрывать, останавливать. «Заблокированное чувство» — то, которому не дают выйти."},{"w":"Невербальный","s":["неверба"],"d":"Без слов: жесты, мимика, поза, интонация."},{"w":"Классический","s":["классич"],"d":"Образцовый, традиционный, ставший основой. «Классический психоанализ» — психоанализ в исходном виде, как у Фрейда."},{"w":"Фундаментальный","s":["фундаме"],"d":"Основной, самый глубокий, на котором всё держится."},{"w":"Коллектив","s":["коллект"],"d":"Группа людей, объединённых общим делом. «Коллективный» значит общий для многих."},{"w":"Органический","s":["органич","неорган"],"d":"Естественный, живой, связанный с организмом; также «цельный, гармоничный»."},{"w":"Фиксировать","s":["фиксиро","фиксиру","зафикси"],"d":"Закреплять, удерживать на месте. О внимании — сосредотачивать."},{"w":"Символ","s":["символи"],"d":"Знак или образ, который означает что-то другое. Символизировать — служить знаком чего-то."},{"w":"Терминология","s":["термино"],"d":"Набор специальных слов (терминов) какой-то науки."},{"w":"Магический","s":["магичес"],"d":"Волшебный. «Магическое мышление» — вера, что мысли или ритуалы сами по себе меняют реальность."},{"w":"Коммуникация","s":["коммуни"],"d":"Общение, передача сообщений между людьми."},{"w":"Конструкция","s":["констру","реконст"],"d":"Устройство, построение. Реконструкция — восстановление, перестройка."},{"w":"Материализм","s":["материа"],"d":"Здесь: связанный с материей, веществом. Материализм — взгляд, что основа мира — вещество, а не дух."},{"w":"Футуристический","s":["футурис"],"d":"Обращённый в будущее. У Перлза о людях, которые живут планами, а не настоящим."},{"w":"Актуализация","s":["актуали","самоакт"],"d":"Превращение возможного в действительное. «Самоактуализация» — раскрытие себя, когда человек становится тем, кем может стать."},{"w":"Компенсация","s":["компенс"],"d":"Возмещение, восполнение. Когда недостаток в одном закрывают чем-то другим."},{"w":"Аллопластический","s":["аллопла"],"d":"Меняющий внешний мир под себя (а не себя под мир)."},{"w":"Аутопластический","s":["аутопла"],"d":"Меняющий себя, чтобы приспособиться к миру."},{"w":"Идеальный","s":["идеальн","идеализ","идеалис"],"d":"Совершенный, образцовый. Идеализировать — видеть кого-то лучше, чем он есть на самом деле."},{"w":"Реорганизация","s":["реорган"],"d":"Перестройка, новое устройство чего-либо."},{"w":"Демонстрировать","s":["демонст","продемо"],"d":"Показывать, наглядно доказывать."},{"w":"Продуцировать","s":["продуци"],"d":"Производить, создавать."},{"w":"Визуальный","s":["визуаль"],"d":"Зрительный, связанный со зрением."},{"w":"Координация","s":["координ"],"d":"Согласованность движений или действий."},{"w":"Профессиональный","s":["професс","непрофе"],"d":"Связанный с работой, специальностью; сделанный мастерски."},{"w":"Идеология","s":["идеолог"],"d":"Система взглядов и идей, которой придерживается группа людей."},{"w":"Прогресс","s":["прогрес"],"d":"Движение вперёд, развитие к лучшему."},{"w":"Динамический","s":["динамич"],"d":"Подвижный, меняющийся, связанный с движением сил."},{"w":"Банальный","s":["банальн"],"d":"Избитый, обыденный, лишённый новизны."},{"w":"Эйдетический","s":["эйдетич"],"d":"Об образах памяти: настолько яркий, что человек «видит» вспоминаемое, как картинку перед глазами."},{"w":"Интуиция","s":["интуици","интуити"],"d":"Чутьё, понимание без рассуждений: «чувствую, что так»."},{"w":"Семантика","s":["семанти"],"d":"Наука о значении слов. « тно в поле зрения. У Перлза — то, что человек «не видит» в себе или в мире, хотя это у него перед глазами."},{"w":"Абстрагироваться","s":["абстраг"],"d":"Отвлечься от деталей, думать «в общем»."},{"w":"Уникальный","s":["уникаль"],"d":"Единственный в своём роде, неповторимый."},{"w":"Реализация","s":["реализа","самореа"],"d":"Осуществление, воплощение задуманного. Самореализация — раскрытие своих способностей."},{"w":"Универсальный","s":["универс"],"d":"Всеобщий, подходящий для всего."},{"w":"Гравитация","s":["гравита"],"d":"Сила притяжения."},{"w":"Переориентация","s":["переори"],"d":"Смена направления, взгляда или цели."},{"w":"Кристаллизация","s":["кристал"],"d":"Образование чего-то чёткого и твёрдого из размытого, как кристалл из раствора."},{"w":"Сконцентрироваться","s":["сконцен"],"d":"Собрать всё внимание на одном."},{"w":"Дезинтеграция","s":["дезинте","дезинег"],"d":"Распад целого на части."},{"w":"Реинтеграция","s":["реинтег"],"d":"Повторное объединение частей в целое."},{"w":"Конституция","s":["констит"],"d":"Здесь: телосложение, природные особенности организма."},{"w":"Трансформация","s":["трансфо"],"d":"Превращение, изменение формы."},{"w":"Предентальный","s":["предент"],"d":"«До зубов»: период младенчества, когда зубов ещё нет и ребёнок только сосёт."},{"w":"Психопатия","s":["психопа"],"d":"Расстройство личности: человек плохо чувствует других и нарушает правила без угрызений совести."},{"w":"Акустический","s":["акустич"],"d":"Звуковой, связанный со слухом."},{"w":"Провоцировать","s":["провоци","провока"],"d":"Вызывать, подталкивать к какому-то поступку или чувству."},{"w":"Оппозиция","s":["оппозиц"],"d":"Противостояние, противоположная сторона."},{"w":"Гипертрофия","s":["гипертр"],"d":"Чрезмерное разрастание, «перебор»."},{"w":"Игнорировать","s":["игнорир","проигно"],"d":"Не обращать внимания, делать вид, что не замечаешь."},{"w":"Сентиментальный","s":["сентиме"],"d":"Чувствительный до слащавости, склонный к умилению."},{"w":"Латентный","s":["латентн"], function plateFor(bookId, title, idx){
  const t = title.toLowerCase();
  const R = [
    [/эмоциональн|сенсомотор|телесн|заикан|тревожн|ощущения тела/,"anxiety"],
    [/дифференциальн|хорошее и плохое|мегаломан|противоположн/,"polarity"],
    [/равновеси|реорганизац|непрерывност/,"cycle"],
    [/защит|сопротивление$|функция организма|изменен|сопротивлен/,"boundary"],
    [/ретрофлекс|застенчив|первое лицо|мобилизац|обращенного/,"retroflexion"],
    [/интроек|интроец|изгнание/,"introjection"],
    [/проекц|паранойял/,"projection"],
    [/слияни/,"confluence"],
    [/пищев|ментальная пища|пустышк|на еде|отрицания/,"metabolism"],
    [/время|прошлое|будущее|вспоминан|классический/,"time"],
    [/реальност|метод|визуализ|действительност|актуальн|интегрирующ|вербализ|чувствован/,"awareness"],
    [/невроз|раскол|джекил/,"topdog"],
    [/сосредоточ|молчани|бессонниц|внимание/,"focus"],
    [/психологическ|дифференцирование|замысел|ответ организма/,"figure"],
  ];
  for (const [re,k] of R) if (re.test(t)) return k;
  if (/^часть \d/.test(t)) return ["pail","chair","topdog","time","awareness","cycle","figure"][(idx)%7];
  return bookId==="pail" ? "pail" : "figure";
}

/* ---------- scene toolkit: small line-art pictures for each chapter ---------- */
const SC = (()=>{
const f = n=>(+n).toFixed(1);
function face(x,y,r,m,d){
  const ex=r*0.38, ey=-r*0.12, dx=(d||0)*r*0.22;
  let o="";
  if (m==="sleep") o+=`<path class="fl" d="M${f(x-ex-3+dx)} ${f(y+ey)} q3 3 6 0 M${f(x+ex-3+dx)} ${f(y+ey)} q3 3 6 0"/>`;
  else o+=`<circle class="ink" cx="${f(x-ex+dx)}" cy="${f(y+ey)}" r="${f(r*0.11)}"/><circle class="ink" cx="${f(x+ex+dx)}" cy="${f(y+ey)}" r="${f(r*0.11)}"/>`;
  const my=y+r*0.42, mw=r*0.36;
  if (m==="happy") o+=`<path class="fl" d="M${f(x-mw+dx)} ${f(my-3)} q${f(mw)} ${f(r*0.4)} ${f(mw*2)} 0"/>`;
  else if (m==="sad") o+=`<path class="fl" d="M${f(x-mw+dx)} ${f(my+2)} q${f(mw)} ${f(-r*0.35)} ${f(mw*2)} 0"/>`;
  else if (m==="scared") o+=`<ellipse class="ink" cx="${f(x+dx)}" cy="${f(my)}" rx="${f(r*0.14)}" ry="${f(r*0.2)}"/>`;
  else if (m==="angry") o+=`<path class="fl" d="M${f(x-ex-4+dx)} ${f(y-r*0.42)} l8 4 M${f(x+ex+4+dx)} ${f(y-r*0.42)} l-8 4 M${f(x-mw+dx)} ${f(my+1)} h${f(mw*2)}"/>`;
  else if (m!=="none") o+=`<path class="fl" d="M${f(x-mw*0.7+dx)} ${f(my)} h${f(mw*1.4)}"/>`;
  return o;
}
/* person: x,y = feet; o:{s,c,pose,mood,dir,label} pose: stand|up|point|cross|hands|head|sit|lie|walk|give|hug|kneel */
function P(x,y,o={}){
  const s=o.s||1, c=o.c||"ac", pose=o.pose||"stand", d=o.dir||0, m=o.mood||"neutral";
  let out="";
  if (pose==="lie"){
    const hx=x-50*s, hy=y-12*s;
    out+=`<rect class="${c}" x="${f(x-36*s)}" y="${f(y-22*s)}" width="${f(64*s)}" height="${f(20*s)}" rx="${f(9*s)}"/>`;
    out+=`<path class="lnk" d="M${f(x+28*s)} ${f(y-14*s)} h${f(36*s)} M${f(x+28*s)} ${f(y-8*s)} h${f(36*s)}"/>`;
    out+=`<circle class="hd" cx="${f(hx)}" cy="${f(hy)}" r="${f(13*s)}"/>`+face(hx,hy,13*s,m,0);
  } else {
    const hy=y-80*s, sit=pose==="sit", kneel=pose==="kneel";
    const hip = sit? y-40*s : kneel? y-30*s : y-34*s;
    const top = hip-36*s;
    out+=`<rect class="${c}" x="${f(x-13*s)}" y="${f(top)}" width="${f(26*s)}" height="${f(40*s)}" rx="${f(10*s)}"/>`;
    const L = (x1,y1,x2,y2)=>`M${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)}`;
    let legs="";
    if (sit){ const dd=d||1; legs=L(x-6*s,hip,x+dd*20*s,hip)+L(x+dd*20*s,hip,x+dd*20*s,y)+L(x+6*s,hip,x+dd*26*s,hip)+L(x+dd*26*s,hip,x+dd*26*s,y); }
    else if (kneel){ legs=L(x-6*s,hip,x-6*s,y-4*s)+L(x-6*s,y-4*s,x-26*s,y-2*s)+L(x+6*s,hip,x+18*s,hip+4*s)+L(x+18*s,hip+4*s,x+18*s,y); }
    else if (pose==="walk"){ legs=L(x-5*s,hip,x-18*s,y)+L(x+5*s,hip,x+16*s,y); }
    else legs=L(x-6*s,hip,x-9*s,y)+L(x+6*s,hip,x+9*s,y);
    out+=`<path class="lnk" d="${legs}"/>`;
    const sh=top+8*s, dd=d||1; let arms="";
    if (pose==="up") arms=L(x-12*s,sh,x-30*s,sh-30*s)+L(x+12*s,sh,x+30*s,sh-30*s);
    else if (pose==="point") arms=L(x-12*s,sh,x-16*s,sh+30*s)+L(x+dd*12*s,sh,x+dd*46*s,sh-4*s);
    else if (pose==="cross") arms=L(x-14*s,sh+16*s,x+14*s,sh+12*s)+L(x-14*s,sh+12*s,x+14*s,sh+16*s);
    else if (pose==="hands"||pose==="give") arms=L(x+dd*12*s,sh,x+dd*40*s,sh+12*s)+L(x-dd*10*s,sh+4*s,x+dd*34*s,sh+18*s);
    else if (pose==="head") arms=L(x-12*s,sh,x-22*s,hy-6*s)+L(x+12*s,sh,x+22*s,hy-6*s);
    else if (pose==="hug") arms=L(x-12*s,sh,x+dd*30*s,sh+6*s)+L(x+12*s,sh,x+dd*34*s,sh+14*s);

const S = Object.assign({fs:18, lh:1.5, theme:"auto", font:"serif"}, store.get("settings2", {}));
function applySettings(){
  const r = document.documentElement;
  r.style.setProperty("--fs", S.fs+"px");
  r.style.setProperty("--lh", S.lh);
  r.removeAttribute("data-paper");
  if (S.theme==="light" || S.theme==="dark") r.setAttribute("data-theme", S.theme);
  else if (S.theme==="sepia"){ r.setAttribute("data-theme","light"); r.setAttribute("data-paper","sepia"); }
  else r.removeAttribute("data-theme");
  if (S.font==="sans") r.setAttribute("data-font","sans"); else r.removeAttribute("data-font");
  store.set("settings2", S);
}

/* ---------- glossary matching ---------- */
const STEMS = [];
GLOSSARY.forEach((g,i)=> g.s.forEach(s=>{
  if (s.startsWith("=")) STEMS.push({exact:true, s:s.slice(1).replace(/[,\-]$/,""), i});
  else STEMS.push({exact:false, s:s.replace(/–/g,"-"), i});
}));
const BY2 = new Map();
STEMS.forEach(st=>{ const k = st.s.slice(0,2); if(!BY2.has(k)) BY2.set(k,[]); BY2.get(k).push(st); });
function lookup(word){
  const w = word.toLowerCase().replace(/ё/g,"е").replace(/–/g,"-");
  const list = BY2.get(w.slice(0,2)); if(!list) return -1;
  let best=null;
  for (const st of list){
    const s = st.s.replace(/ё/g,"е");
    if (st.exact ? w===s : w.startsWith(s)) { if(!best || s.length>best.s.length) best=st; }
  }
  return best? best.i : -1;
}

const bookCache = {};
async function loadBook(id){
  if (bookCache[id]) return bookCache[id];
  const b = BOOKS.find(x=>x.id===id);
  const res = await fetch(b.file);
  if (!res.ok) throw new Error("Не удалось загрузить книгу");
  const data = await res.json();
  data.chapters.forEach((c,i)=>{ c.len = c.paras.reduce((a,p)=>a+p.length,0); });
  data.total = data.chapters.reduce((a,c)=>a+c.len,0);
  bookCache[id] = data; return data;
}

function avatarSrc(p){ if(!p) return presetAvatar(7); return p.photo ? p.photo : presetAvatar(p.preset||0); }

/* ---------- identity: Claude account → reader profile (synced across devices) ---------- */
const ID = { ready:false, db:null, user:null, uid:null, cloud:false, readOnly:false, profile:null, readers:[], unsub:null };
let idReady;
const idPromise = new Promise(r=>idReady=r);
(async()=>{
  try{
    const C = window.claude;
    if (C && C.use){
      const db = null, user = null;
      ID.db = db; ID.user = user;
      ID.uid = user ? await user.id() : null;
      if (db && ID.uid){
        ID.cloud = true;
        try{
          const snap = await db.doc("readers/"+ID.uid).get();
          if (snap.exists) ID.profile = snap.data();
        }catch(e){}
        ID.unsub = db.collection("readers").onSnapshot(q=>{
          ID.readers = q.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}));
          const mine = ID.readers.find(r=>r.id===ID.uid);
          if (mine) ID.profile = mine;
          refreshReaders();
        }, ()=>{});
      }
    }
  }catch(e){}
  if (!ID.profile) ID.profile = store.get("profile", null);
  ID.ready = true; idReady();
  refreshReaders(); refreshMe();
})();
setTimeout(()=>{ if(!ID.ready){ ID.profile = store.get("profile", null); ID.ready=true; idReady(); refreshReaders(); refreshMe(); } }, 9000);

async function saveProfile(p){
  ID.profile = Object.assign({}, ID.profile||{}, p, {updatedAt: Date.now()});
  store.set("profile", ID.profile);
  if (ID.cloud && !ID.readOnly){
    try{ await ID.db.doc("readers/"+ID.uid).set(JSON.parse(JSON.stringify(ID.profile))); return true; }
    catch(e){ if (e && (e.code==="invalid_argument" || e.code==="not_granted")) ID.readOnly = true; return false; }
  }
  return !ID.cloud;
}
let cloudTimer=null, lastCloud={};
function syncProgress(bookId, pos){
  if (!ID.cloud || ID.readOnly || !ID.profile || !ID.profile.name) return;
  const prev = lastCloud[bookId] || (ID.profile.books||{})[bookId];
  if (prev && prev.ch===pos.ch && Math.abs((prev.pct||0)-(pos.pct||0))<0.004) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(async()=>{
    lastCloud[bookId] = pos;
    try{ await ID.db.doc("readers/"+ID.uid).update({books:{[bookId]:pos}, seenAt:Date.now()}); }
    catch(e){ if (e && e.code==="invalid_argument"){ try{ await saveProfile({books:Object.assign({}, ID.profile.books||{}, {[bookId]:pos})}); }catch(_){} } }
  }, 5000);
}
function bestPos(id){
  const local = store.get("pos:"+id, null);
  const cloud = ID.profile && ID.profile.books ? ID.profile.books[id] : null;
  if (local && cloud) return (cloud.at||0) > (local.at||0) ? cloud : local;
  return local || cloud || null;
}
function progressOf(id){ return bestPos(id); }

/* ---------- "Читают Аня, Таня и ещё 12 человек" ---------- */
function plural(n, one, few, many){ const m10=n%10, m100=n%100; if(m10===1&&m100!==11) return one; if(m10>=2&&m10<=4&&(m100<12||m100>14)) return few; return many; }
function readersOf(bookId){
  let list = ID.readers.filter(r=>r.name && r.books && r.books[bookId]);
  if (!ID.cloud && ID.profile && ID.profile.name && store.get("pos:"+bookId,null)) list = [{id:"me", ...ID.profile, books:{[bookId]:store.get("pos:"+bookId)}}];
  return list.sort((a,b)=>(b.books[bookId].at||0)-(a.books[bookId].at||0));
}
function readersLine(bookId){
  const list = readersOf(bookId);
  if (!list.length) return `<span class="none">Пока никто не читает. Станьте первым.</span>`;
  const isMe = r => r.id===ID.uid || r.id==="me";
  if (list.length>1){ const mi=list.findIndex(isMe); if(mi>=0) list.push(list.splice(mi,1)[0]); }
  const names = list.map(r=> isMe(r) ? "вы" : esc(r.name));
  const n = list.length;
  let txt;
  if (n===1) txt = isMe(list[0]) ? "Читаете <b>вы</b>" : `Читает <b>${names[0]}</b>`;
  else if (n===2) txt = `Читают <b>${names[0]}</b> и <b>${names[1]}</b>`;
  else { const rest=n-2; txt = `Читают <b>${names[0]}</b>, <b>${names[1]}</b> и ещё ${rest} ${plural(rest,"человек","человека","человек")}`; }
  const imgs = list.slice(0,5).map(r=>`<img src="${esc(avatarSrc(r))}" alt="">`).join("");
  return `<span class="stack">${imgs}</span><span class="who">${txt}</span>`;
}
function refreshReaders(){
  document.querySelectorAll("[data-readers]").forEach(el=>{ el.innerHTML = readersLine(el.dataset.readers); el.disabled = !readersOf(el.dataset.readers).length; });

/* ---------- profile modal: name + avatar ---------- */
function resizePhoto(file){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const S=160, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
      const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.82)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

    <p class="note" id="pnote">${ID.cloud ? "Профиль привязан к вашему аккаунту Claude: открывайте библиотеку с телефона или компьютера, и вы попадёте в свой профиль, а книга откроется на том же месте." : "Профиль сохранится на этом устройстве. Чтобы он был на всех устройствах, откройте библиотеку, войдя в свой аккаунт Claude."}</p>

  };

  setTimeout(()=>inp.focus(), 50);
  $("#pfile",m).onchange = async(e)=>{ const f=e.target.files[0]; if(!f) return; try{ choice={photo: await resizePhoto(f)}; draw(); }catch(_){ $("#pnote",m).textContent="Это фото не открылось. Попробуйте другое (JPG или PNG)."; } };
  const close = ()=>{ scrim.remove(); m.remove(); };

    if (after) after();
  };
}
