const MODULES = [
  {n:1, from:"2026-10-09", to:"2026-10-11", label:"9–11 октября", photo:MOD1_PHOTO},
  {n:2, from:"2026-12-04", to:"2026-12-06", label:"4–6 декабря"},
  {n:3, from:"2027-02-05", to:"2027-02-07", label:"5–7 февраля"}
];
function modulesHtml(){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = s=>{ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); };
  let nextFound = false;
  const cards = MODULES.map(m=>{
    const a=d(m.from), b=d(m.to); let st, cls;
    if (today > b){ st="прошёл"; cls="past"; }
    else if (today >= a){ st="идёт сейчас"; cls="now"; nextFound=true; }
    else if (!nextFound){ const days=Math.round((a-today)/86400000); st = days===1?"завтра":`через ${days} ${plural(days,"день","дня","дней")}`; cls="next"; nextFound=true; }
    else { st="впереди"; cls="later"; }
    const stHtml = (cls==="past" && m.photo) ? `<button class="mod-photo" data-mod="${m.n}">Фото ↗</button>` : `<span class="mod-s">${st}</span>`;
    return `<div class="mod ${cls}"><span class="mod-n">${m.n} модуль</span><b>${m.label}</b>${stHtml}</div>`;
  }).join("");
  return `<section class="mods"><h2 class="mods-h">Расписание модулей</h2><div class="mods-row">${cards}</div></section>`;
}

function showPhoto(m){
  closeLayers();
  const scrim=h(`<div class="scrim"></div>`), box=h(`<div class="modal photo-box" role="dialog" aria-label="Фото модуля"><img src="${m.photo}" alt="${m.n} модуль, ${m.label}"><div class="photo-cap"><span>${m.n} модуль · ${m.label}</span><button class="ib" title="Закрыть">${ICON.x}</button></div></div>`);
  document.body.append(scrim, box); scrim.onclick=closeLayers; box.querySelector(".ib").onclick=closeLayers;
}
/* ---------- word of the visit: a new term from the core dictionary on every visit ---------- */
const CORE = Math.min(213, GLOSSARY.length);
function pickWord(force){
  let seen = store.get("wod_seen", []);
  if (!force){ const cur = store.get("wod_cur", null); if (cur && cur.at && Date.now()-cur.at < 60*1000 && cur.i < CORE) return cur.i; }
  let pool = [...Array(CORE).keys()].filter(i=>!seen.includes(i) && GLOSSARY[i].d && GLOSSARY[i].d.length > 40);
  if (!pool.length){ seen = []; pool = [...Array(CORE).keys()]; }
  const i = pool[Math.floor(Math.random()*pool.length)];
  store.set("wod_seen", [...seen, i]); store.set("wod_cur", {i, at: Date.now()});
  return i;
}
function drawWord(i){
  const g = GLOSSARY[i], el = $("#wod"); if (!el) return;
  el.innerHTML = `<span class="wod-k">Слово дня</span>
    <h2 class="wod-w">${esc(g.w)}</h2>
    <p class="wod-d">${esc(g.d)}</p>${g.e?`<p class="wod-e"><b>Пример:</b> ${esc(g.e)}</p>`:""}
    <button class="wod-next" id="wodn">Ещё слово ↻</button>
    <p class="wod-tip">Нажмите на любое слово в книге — и внизу появится такое же простое объяснение. Подчёркнутые точками слова есть в <button class="linkish" id="wodd">словаре</button>.</p>`;
  $("#wodn").onclick = ()=>{ const j = pickWord(true); drawWord(j); };
  $("#wodd").onclick = ()=>go({name:"dict"});
}

async function openBook(id, ch){
  if (!ID.ready){ const btns=app.querySelectorAll(`[data-open="${id}"]`); btns.forEach(b=>b.disabled=true); await idPromise; btns.forEach(b=>b.disabled=false); }
  const p = progressOf(id);
  const chapter = ch!=null ? ch : (p? p.ch : 0);
  go({name:"read", book:id, ch:chapter, restore: ch==null && p ? p.y : 0});
}

/* ---------- reader ---------- */
let saveTimer=null, curBook=null;
/* ---------- Слушать (озвучка голосом устройства) ---------- */
const TTS = { on:false, paused:false, k:-1, parts:[], pi:0, rate: store.get("ttsRate", 1), voice:null, ka:null, auto:false };
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function ttsVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang));
  const pref = [/natural|neural|online/i, /milena|милена/i, /google/i, /yuri|katya|irina|pavel|svetlana|dariya/i];
  for (const r of pref){ const v = vs.find(v=>r.test(v.name)); if (v) return v; }
  return vs[0] || null;
}
if (ttsOK) speechSynthesis.onvoiceschanged = ()=>{ TTS.voice = ttsVoice(); };
function ttsParas(){ return [...document.querySelectorAll("#page > p:not(.eyebrow), #page > h2.ch")]; }
function ttsSplit(t){
  const out = []; let cur = "";
  (t.match(/[^.!?…]+[.!?…»"]*\s*/g) || [t]).forEach(s=>{
    if ((cur + s).length > 220 && cur){ out.push(cur); cur = ""; }
    cur += s;
    while (cur.length > 300){ const cut = cur.lastIndexOf(" ", 260) > 80 ? cur.lastIndexOf(" ", 260) : 260; out.push(cur.slice(0,cut)); cur = cur.slice(cut); }
  });
  if (cur.trim()) out.push(cur);
  return out;
}
function ttsStartIndex(){
  const ps = ttsParas(), top = window.scrollY + 70;
  const k = ps.findIndex(p=> p.offsetTop + p.offsetHeight > top + 10);
  return Math.max(0, k);
}
function ttsMark(){
  document.querySelectorAll("#page .speaking").forEach(n=>n.classList.remove("speaking"));
  const p = ttsParas()[TTS.k]; if (!p) return;
  p.classList.add("speaking");
  const r = p.getBoundingClientRect();
  if (r.top < 70 || r.top > window.innerHeight*0.55) window.scrollTo({top: window.scrollY + r.top - 90, behavior:"smooth"});
}
function ttsSpeakNext(){
  if (!TTS.on || TTS.paused) return;
  if (TTS.pi >= TTS.parts.length){
    TTS.k++;
    const ps = ttsParas();
    if (TTS.k >= ps.length){                       // глава закончилась → следующая
      if (curBook && view.ch < curBook.chapters.length-1){ TTS.auto = true; go({name:"read", book:view.book, ch:view.ch+1}); }
      else ttsStop();
      return;
    }
    TTS.parts = ttsSplit(ps[TTS.k].innerText.replace(/\s+/g," ").trim()); TTS.pi = 0; ttsMark();
    if (!TTS.parts.length){ ttsSpeakNext(); return; }
  }
  const u = new SpeechSynthesisUtterance(TTS.parts[TTS.pi]);
  u.lang = "ru-RU"; u.rate = TTS.rate; try{ if (TTS.voice) u.voice = TTS.voice; }catch(e){}
  u.onend = ()=>{ TTS.pi++; ttsSpeakNext(); };
  u.onerror = (e)=>{ if (e.error==="interrupted"||e.error==="canceled") return; TTS.pi++; ttsSpeakNext(); };
  speechSynthesis.speak(u);
}
function ttsPlayFrom(k){
  speechSynthesis.cancel();
  TTS.voice = TTS.voice || ttsVoice();
  TTS.on = true; TTS.paused = false; TTS.k = k - 1; TTS.parts = []; TTS.pi = 0;
  clearInterval(TTS.ka); TTS.ka = setInterval(()=>{ if (TTS.on && !TTS.paused && speechSynthesis.paused) speechSynthesis.resume(); }, 5000);
  ttsBar(); ttsSpeakNext();
}
function ttsToggle(){
  if (!TTS.on){ ttsPlayFrom(ttsStartIndex()); return; }
  if (TTS.paused){                                   // продолжить с того абзаца, где остановились
    const k = TTS.k; ttsPlayFrom(k < 0 ? 0 : k);
  } else { TTS.paused = true; speechSynthesis.cancel(); ttsBar(); }
}
function ttsStop(){
  TTS.on = false; TTS.paused = false; clearInterval(TTS.ka);
  if (ttsOK) speechSynthesis.cancel();
  document.querySelectorAll("#page .speaking").forEach(n=>n.classList.remove("speaking"));
  const b = $("#ttsbar"); if (b) b.remove();
  const t = $("#ttsb"); if (t) t.classList.remove("on");
}
const TTS_RATES = [0.8, 1, 1.25, 1.5, 1.75];
function ttsBar(){
  let b = $("#ttsbar");
  if (!b){ b = h(`<div class="ttsbar" id="ttsbar" role="region" aria-label="Озвучка"></div>`); document.body.appendChild(b); }
  b.innerHTML = `<button class="tt-play" id="ttp" aria-label="${TTS.paused?"Продолжить":"Пауза"}">${TTS.paused ? "▶" : "❚❚"}</button>
    <span class="tt-lbl">${TTS.paused ? "Пауза" : "Читаю вслух…"}</span>
    <button class="tt-rate" id="ttr" title="Скорость">${String(TTS.rate).replace(".",",")}×</button>
    <button class="tt-x" id="ttx" aria-label="Остановить">✕</button>`;
  $("#ttp").onclick = ttsToggle;
  $("#ttx").onclick = ttsStop;
  $("#ttr").onclick = ()=>{ const i = TTS_RATES.indexOf(TTS.rate); TTS.rate = TTS_RATES[(i+1) % TTS_RATES.length]; store.set("ttsRate", TTS.rate);
    if (TTS.on && !TTS.paused){ const k = TTS.k; ttsPlayFrom(Math.max(0,k)); } else ttsBar(); };
  const t = $("#ttsb"); if (t) t.classList.add("on");
}

function ttsAfterRender(){
  const t = $("#ttsb");
  if (t){ if (!ttsOK) t.remove(); else { t.onclick = ttsToggle; if (TTS.on) t.classList.add("on"); } }
  if (TTS.listen){ TTS.listen = false; setTimeout(()=>ttsPlayFrom(ttsStartIndex()), 450); }
  else if (TTS.auto){ TTS.auto = false; setTimeout(()=>ttsPlayFrom(0), 400); }
  else if (TTS.on){ ttsStop(); }

  const plain = c.paras.map(p=>plainText(p));
  const pics = (PICS[view.book+":"+i] || []).map((pc,n)=>{ let k=-1; if (pc.at){ k = plain.findIndex(t=>t.includes(pc.at)); if (k<0) k = Math.floor(c.paras.length*(n+1)/((PICS[view.book+":"+i]||[]).length+1)); } return Object.assign({k}, pc); });
  const figs = (FIGS[view.book+":"+i] || []).map(f=>{ if (f.at==null) return f; const k = plain.findIndex(t=> f.exact ? t.trim()===f.at : t.includes(f.at)); return Object.assign({}, f, {after: k<0 ? c.paras.length-1 : k}); });
  const paras = figs.filter(f=>f.after===-1).map(figureHtml).join("") + c.paras.map((p,k)=>{
    const here = figs.filter(f=>f.after===k);
    const skip = here.some(f=>f.replace);
    const short = plain[k].length < 60, verse = short && ((plain[k-1]||"").length < 60 || (plain[k+1]||"").length < 60);
    const cls = [k===0?"first":"", verse?"v":""].filter(Boolean).join(" ");
    const body = skip ? "" : (p==="<hr>" ? "<hr>" : `<p${cls?` class="${cls}"`:""}>${markTerms(p, seen)}</p>`);
    return body + here.map(figureHtml).join("") + pics.filter(pc=>pc.k===k).map(picHtml).join("");
  }).join("");
  const prev = i>0 ? book.chapters[i-1] : null, next = i<book.chapters.length-1 ? book.chapters[i+1] : null;
  $(".reader").innerHTML = `
    <article class="page" id="page" lang="ru">
      ${c.part? `<p class="eyebrow">${esc(c.part)}</p>`:""}
      <h2 class="ch">${esc(c.title)}</h2>
      ${pics.filter(pc=>pc.k<0).map(picHtml).join("")}

  const th = $("#tohome"); if (th) th.onclick=()=>go({name:"home"});
  if (view.restore){ requestAnimationFrame(()=>{ const pg=$("#page"); window.scrollTo(0, pg.offsetTop + view.restore*pg.offsetHeight - 80); view.restore=0; }); }

function plateHtml(bookId, title, i){
  const k = plateFor(bookId, title, i), pl = PLATES[k]; if(!pl) return "";
  return `<figure class="plate"><svg viewBox="0 0 600 260" role="img" aria-label="${esc(pl.cap)}">${pl.svg}</svg><figcaption>${esc(pl.cap)}</figcaption></figure>`;
}
function markTerms(html, seen){
  // wrap the first occurrence (per chapter) of each glossary term in a dotted span; leave tags intact
  return html.split(/(<[^>]+>)/).map(seg=>{
    if (seg.startsWith("<")) return seg;
    return seg.replace(/[А-Яа-яЁё][А-Яа-яЁё\-]{3,}/g, (w)=>{
      const gi = lookup(w);
      if (gi<0 || seen.has(gi)) return w;
      seen.add(gi);
      return `<span class="t" data-g="${gi}">${w}</span>`;
    });
  }).join("");
}
function chapterFrac(){
  const pg = $("#page"); if(!pg) return 0;
  const y = window.scrollY + 80 - pg.offsetTop;
  return Math.max(0, Math.min(1, y / Math.max(1, pg.offsetHeight - window.innerHeight*0.6)));
}
function updateProg(){
  const bar = $("#prog"); if (!bar || !curBook) return;
  bar.style.width = (chapterFrac()*100)+"%";
}
function savePos(){
  if (view.name!=="read" || !curBook) return;
  const i = view.ch, c = curBook.chapters[i]; if(!c) return;
  const pg = $("#page"); if(!pg) return;
  const y = Math.max(0, (window.scrollY + 80 - pg.offsetTop) / Math.max(1,pg.offsetHeight));
  const before = curBook.chapters.slice(0,i).reduce((a,x)=>a+x.len,0);
  const pct = (before + c.len*chapterFrac()) / curBook.total;
  const pos = {ch:i, y:Math.round(y*1000)/1000, pct:Math.round(pct*1000)/1000, chTitle:c.title, at:Date.now()};
  store.set("pos:"+view.book, pos);
  store.set("last", view.book);
  syncProgress(view.book, pos);
}
window.addEventListener("scroll", ()=>{
  if (view.name!=="read") return;
  updateProg();
  clearTimeout(saveTimer); saveTimer = setTimeout(savePos, 400);
}, {passive:true});
document.addEventListener("keydown", (e)=>{
  if (e.key==="Escape"){ closeDef(); closeLayers(); }
  if (view.name!=="read" || !curBook || e.target.closest("input")) return;
  if (e.key==="ArrowRight" && view.ch<curBook.chapters.length-1) go({name:"read",book:view.book,ch:view.ch+1});
  if (e.key==="ArrowLeft" && view.ch>0) go({name:"read",book:view.book,ch:view.ch-1});
});

/* ---------- TOC drawer ---------- */
function closeLayers(){ document.querySelectorAll(".scrim,.drawer,.settings,.modal").forEach(n=>n.remove()); }
function openToc(book, cur){
  closeLayers();
  let last = null, html = "";
  book.chapters.forEach((c,i)=>{
    const grp = (c.part||"").split(" · ")[0];
    if (grp && grp!==last){ html += `<div class="grp">${esc(grp)}</div>`; }
    last = grp || last;
    const sub = c.part && c.part.includes(" · ") ? c.part.split(" · ").slice(1).join(" · ") : (c.hint||"");
    html += `<button data-i="${i}" aria-current="${i===cur}">${esc(c.title)}${sub?`<small>${esc(sub)}</small>`:""}</button>`;
  });
  const scrim = h(`<div class="scrim"></div>`), dr = h(`<aside class="drawer" role="dialog" aria-label="Оглавление"><header><b>Оглавление</b><button class="ib" title="Закрыть">${ICON.x}</button></header><div class="toc">${html}</div></aside>`);
  document.body.append(scrim, dr);
  scrim.onclick = closeLayers; $("header .ib", dr).onclick = closeLayers;
  dr.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ closeLayers(); go({name:"read", book:view.book, ch:+b.dataset.i}); });
  const curBtn = dr.querySelector('[aria-current="true"]'); if (curBtn) curBtn.scrollIntoView({block:"center"});
}

/* ---------- word click → definition ---------- */
function caretAt(x,y){
  if (document.caretPositionFromPoint){ const p=document.caretPositionFromPoint(x,y); return p? {node:p.offsetNode, off:p.offset}:null; }
  if (document.caretRangeFromPoint){ const r=document.caretRangeFromPoint(x,y); return r? {node:r.startContainer, off:r.startOffset}:null; }
  return null;
}
const WCH = /[А-Яа-яЁёA-Za-z\-]/;
function sentenceAround(p, word, charIndex){
  const text = p.textContent;
  let s = charIndex, e = charIndex;
  while (s>0 && !/[.!?…]/.test(text[s-1])) s--;
  while (e<text.length && !/[.!?…]/.test(text[e])) e++;
  let sent = text.slice(s, Math.min(text.length, e+1)).trim();
  if (sent.length>420) { const k = sent.indexOf(word); sent = "…"+sent.slice(Math.max(0,k-200), k+200)+"…"; }
  return sent;
}
function offsetInBlock(block, node, off){
  let n=0; const w=document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  while (w.nextNode()){ if (w.currentNode===node) return n+off; n += w.currentNode.data.length; }
  return n;
}
let lastHl=null;
function clearHl(){ if(lastHl){ const p=lastHl.parentNode; if(p){ p.replaceChild(document.createTextNode(lastHl.textContent), lastHl); p.normalize(); } lastHl=null; } }
document.addEventListener("click", (e)=>{
  const page = e.target.closest("#page");
  if (!page) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && sel.toString().trim().length>1) return; // handled by selection
  const block = e.target.closest("p"); if(!block) return;
  const t = e.target.closest(".t");
  const c = caretAt(e.clientX, e.clientY);
  if (!c || c.node.nodeType!==3) return;
  const txt = c.node.data; let s=c.off, en=c.off;
  if (s>=txt.length || !WCH.test(txt[s])) { if (s>0 && WCH.test(txt[s-1])) s--, en--; else return; }
  while (s>0 && WCH.test(txt[s-1])) s--;
  while (en<txt.length && WCH.test(txt[en])) en++;
  let word = txt.slice(s,en).replace(/^-+|-+$/g,"");
  if (word.length<2) return;
  const charIndex = offsetInBlock(block, c.node, s);
  const ctx = sentenceAround(block, word, charIndex);
  clearHl();
  if (!t){ const r=document.createRange(); r.setStart(c.node,s); r.setEnd(c.node,en); const sp=document.createElement("span"); sp.className="hl"; try{ r.surroundContents(sp); lastHl=sp; }catch(_){} }
  const gi = t ? +t.dataset.g : lookup(word);
  showDef({word, gi, ctx, book: curBook? curBook.title : ""});
});
document.addEventListener("mouseup", (e)=>{
  if (!e.target.closest || !e.target.closest("#page")) return;
  setTimeout(()=>{
    const sel = window.getSelection(); if (!sel || sel.isCollapsed) return;
    const s = sel.toString().replace(/\s+/g," ").trim();
    if (s.length<2 || s.split(" ").length>14) return;
    const block = sel.anchorNode && sel.anchorNode.parentElement && sel.anchorNode.parentElement.closest("p");
    const ctx = block ? sentenceAround(block, s, offsetInBlock(block, sel.anchorNode, sel.anchorOffset)) : "";
    const gi = s.split(" ").length===1 ? lookup(s) : -1;
    showDef({word:s, gi, ctx, book: curBook? curBook.title : "", phrase: s.includes(" ")});
  }, 10);
});

let sampleFn = undefined; // undefined = not resolved yet, null = unavailable
(async()=>{ try{ sampleFn = window.claude && window.claude.use ? await window.claude.use("sample") : null; }catch(e){ sampleFn=null; } })();
let aiCtl=null;
function remember(word, gi){
  const mine = store.get("mine", []);
  const key = gi>=0 ? GLOSSARY[gi].w : word.toLowerCase();
  const nx = [key, ...mine.filter(x=>x!==key)].slice(0,60);
  store.set("mine", nx);
}
function closeDef(){ const d=$(".def"); if(d) d.remove(); if(aiCtl) aiCtl.abort(); aiCtl=null; clearHl(); }
function showDef({word, gi, ctx, book, phrase}){
  closeDef();
  const g = gi>=0 ? GLOSSARY[gi] : null;
  const card = h(`<aside class="def" role="dialog" aria-label="Объяснение слова">
    <div class="top"><div class="word">${esc(g? g.w : word)}</div><button class="ib" title="Закрыть">${ICON.x}</button></div>
    ${g? `<div class="kind">Из словаря${g.w.toLowerCase()!==word.toLowerCase()?` · в тексте «${esc(word)}»`:""}</div><div class="txt">${esc(g.d)}</div>${g.e?`<div class="ex">${esc(g.e)}</div>`:""}`:""}
    <div class="ai"><div class="kind" hidden>Объяснение в этом месте текста</div><div class="txt"></div></div>
    ${ctx? `<div class="ctx">«${esc(ctx)}»</div>`:""}
    <div class="acts"></div>
  </aside>`);
  document.body.append(card);
  $(".top .ib", card).onclick = closeDef;
  remember(word, gi);
  const acts = $(".acts", card);
  const aiBox = $(".ai", card);
  const ask = ()=> askClaude({word, ctx, book, phrase, g}, aiBox, acts);
  const wait = async()=>{ for(let i=0;i<40 && sampleFn===undefined;i++) await new Promise(r=>setTimeout(r,100)); };
  (async()=>{
    await wait();
    if (!sampleFn){
      if (!g) { aiBox.querySelector(".txt").innerHTML = `<span class="err">Этого слова нет в словаре, а объяснения от Claude здесь недоступны.</span>`; }
      const q = encodeURIComponent(phrase? word : word.toLowerCase());
      acts.innerHTML = `<a class="btn ghost" href="https://ru.wiktionary.org/wiki/${q}" target="_blank" rel="noopener">Викисловарь</a><a class="btn ghost" href="https://ru.wikipedia.org/w/index.php?search=${q}" target="_blank" rel="noopener">Википедия</a>`;
      return;
    }
    if (g){ acts.innerHTML = `<button class="btn ghost">Объяснить именно в этом предложении</button>`; acts.firstChild.onclick = ask; }
    else ask();
  })();
}
async function askClaude({word, ctx, book, phrase, g}, aiBox, acts){
  const kind = $(".kind", aiBox), out = $(".txt", aiBox);
  kind.hidden = false; acts.innerHTML = "";
  out.innerHTML = `<span class="dots"><i></i><i></i><i></i></span>`;
  aiCtl = new AbortController();
  const prompt =
`Ты помогаешь новичку читать книгу по психологии (Фредерик Перлз, «${book||"книга по гештальт-терапии"}»). Читатель не понял ${phrase?"фразу":"слово"}: «${word}».
${ctx?`Вот предложение, где оно встретилось:\n«${ctx}»\n`:""}
Объясни по-русски очень простым языком, как другу без психологического образования:
1) что ${phrase?"значит эта фраза":"значит это слово"} в этом месте текста (2–3 коротких предложения, без сложных терминов; если без термина не обойтись, сразу объясни его);
2) одна строка «Например: …» с бытовым примером из жизни.
Если слово обычное, просто дай понятный синоним и смысл. Без вступлений, без заголовков, без markdown, не больше 70 слов.`;
  try{
    const r = await sampleFn(prompt, {modelTier:"quick", signal:aiCtl.signal, onText:({text})=>{ out.textContent = text; }});
    out.textContent = r.text.trim();
  }catch(e){
    if (e && e.code==="aborted") return;
    const msg = e && e.code==="not_granted" ? "Объяснения от Claude выключены. Разрешите их в меню страницы, чтобы видеть их снова."
      : e && e.code==="rate_limited" ? "Слишком много вопросов подряд. Подождите минуту и нажмите ещё раз."
      : "Не получилось получить объяснение. Попробуйте ещё раз.";
    out.innerHTML = (e && e.text ? esc(e.text)+"<br>" : "") + `<span class="err">${msg}</span>`;
    if (!(e && e.code==="not_granted")){ acts.innerHTML = `<button class="btn ghost">Спросить ещё раз</button>`; acts.firstChild.onclick=()=>askClaude({word, ctx, book, phrase, g}, aiBox, acts); }
  }
}

/* ---------- dictionary ---------- */
function renderDict(){
  const sorted = GLOSSARY.map((g,i)=>({...g,i})).sort((a,b)=>a.w.localeCompare(b.w,"ru"));
  const letters = [...new Set(sorted.map(g=>g.w[0].toUpperCase()))];
  const mine = store.get("mine", []);
  app.innerHTML = topbar("Словарь", `${GLOSSARY.length} терминов`, `<button class="ib" id="home">${ICON.back}<span class="lbl">Книги</span></button>`, `<button class="ib" id="setb" title="Шрифт и тема">${ICON.aa}</button>`) +
  `<main class="wrap">
    <h1>Словарь трудных слов</h1>
    <p class="sub">Термины из книг Перлза простым языком. Слова, которых здесь нет, объяснит Claude, если нажать на них в тексте.</p>
    ${mine.length? `<div class="kind" style="font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)">Вы недавно смотрели</div><div class="mine">${mine.slice(0,24).map(m=>`<button class="chip" data-m="${esc(m)}">${esc(m)}</button>`).join("")}</div>`:""}
    <input class="search" id="q" type="search" placeholder="Найти слово, например «проекция»" autocomplete="off">
    <div class="letters">${letters.map(l=>`<button data-l="${l}">${l}</button>`).join("")}</div>
    <dl class="gl" id="gl"></dl>
  </main>`;
  $("#home").onclick=()=>go({name:"home"}); $("#setb").onclick=toggleSettings;
  const gl = $("#gl");
  const draw = (q)=>{
    q = (q||"").toLowerCase().trim();
    let last="", out="";
    sorted.forEach(g=>{
      if (q && !(g.w.toLowerCase().includes(q) || g.d.toLowerCase().includes(q) || lookup(q)===g.i)) return;
      const L = g.w[0].toUpperCase();
      if (!q && L!==last){ out += `<div class="lh" id="L-${L}">${L}</div>`; last=L; }
      out += `<dt id="g-${g.i}">${esc(g.w)}</dt><dd>${esc(g.d)}${g.e?`<span class="ex">Пример: ${esc(g.e)}</span>`:""}</dd>`;
    });
    gl.innerHTML = out || `<p class="sub">Ничего не нашлось. Попробуйте начало слова.</p>`;
  };
  draw("");
  $("#q").oninput = (e)=>draw(e.target.value);
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ $("#q").value=""; draw(""); const t=$("#L-"+b.dataset.l); if(t) t.scrollIntoView({behavior:"smooth"}); });
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ const gi=lookup(b.dataset.m); const exact=GLOSSARY.findIndex(g=>g.w===b.dataset.m); const i = exact>=0?exact:gi;
    if (i>=0){ $("#q").value=""; draw(""); const t=$("#g-"+i); if(t) t.scrollIntoView({behavior:"smooth",block:"center"}); }
    else showDef({word:b.dataset.m, gi:-1, ctx:"", book:""}); });
}

  `<main class="wrap">

    <div class="video">

      <div class="body">
        <a class="btn" href="${VIDEO_URL}" target="_blank" rel="noopener">Смотреть на YouTube</a>

}

(function(){ const lb = store.get("last", null); if (lb && BOOKS.some(x=>x.id===lb) && store.get("pos:"+lb,null)) openBook(lb); else render(); })();
